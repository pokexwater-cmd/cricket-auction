<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cricket Auction</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1a14;--panel:#14261d;--card:#172b21;--line:#264434;--text:#eef3ee;--mute:#8fa89a;--ball:#d8402f;
        --diamond:#7fdcff;--emerald:#3fd18b;--gold:#e6b447;--silver:#bcc6d0;--bronze:#c9803f;
        --bat:#f2b134;--bowl:#e4574a;--all:#3cc4b0;--head:'Poppins','Inter','Segoe UI',Roboto,system-ui,sans-serif;
        box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(ellipse at 50% 120%,#1d4a34 0,transparent 60%),var(--bg)}
  #app{max-width:1000px;margin:0 auto;padding:24px 18px}
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .center{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .logo{width:74px;height:74px;border-radius:50%;background:var(--ball);position:relative;margin-bottom:18px;box-shadow:inset -8px -8px 14px #0004}
  .logo::before,.logo::after{content:"";position:absolute;left:8px;right:8px;height:2px;border-top:2px dashed #fff8;top:30px}
  .logo::after{top:42px}
  h1{font-family:var(--head);font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;margin:0;letter-spacing:.02em}
  .sub{color:var(--mute);margin:10px 0 24px}
  .menu-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn{padding:15px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--head);font-size:1.2rem;letter-spacing:.05em}
  .btn.primary{background:var(--ball);border-color:var(--ball)}
  .btn:hover{filter:brightness(1.15)}
  .link{background:none;border:0;color:var(--mute);margin-top:16px}
  .form{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:left}
  .form h2{font-family:var(--head);font-size:1.8rem;margin:0 0 18px}
  label{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;color:var(--mute);font-size:.9rem}
  label b{color:var(--text);font-family:var(--head);font-size:1.4rem}
  input[type=text],input[type=number]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
  input[type=range]{width:100%;accent-color:var(--ball)}
  .hint{font-size:.8rem;color:var(--mute);margin-top:2px}
  .code-in{text-align:center;font-family:var(--head);font-size:2rem!important;letter-spacing:.3em;text-transform:uppercase}
  .form .btn{width:100%;margin-top:22px}
  .room{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .room h2{font-family:var(--head);margin:0;font-size:1.8rem}
  .room .code{font-family:var(--head);background:var(--panel);border:1px dashed var(--gold);color:var(--gold);padding:2px 10px;border-radius:6px;letter-spacing:.15em}
  .room .btn{font-size:1rem;padding:8px 16px}
  .card{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .T-diamond{--t:var(--diamond)}.T-emerald{--t:var(--emerald)}.T-gold{--t:var(--gold)}.T-silver{--t:var(--silver)}.T-bronze{--t:var(--bronze)}
  .card .left{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:linear-gradient(160deg,color-mix(in srgb,var(--t) 35%,transparent),transparent);border-right:2px solid var(--t)}
  .tier{font-family:var(--head);color:var(--t);font-size:1.05rem;letter-spacing:.06em}
  .stars{font-size:.8rem;color:var(--t);letter-spacing:1px}
  .stars i{font-style:normal;opacity:.25}
  .tot{font-size:.7rem;color:var(--mute)}
  .abil{margin-top:6px;font-size:.72rem;line-height:1.3;color:var(--mute)}
  .card .body{padding:10px 12px;flex:1;min-width:0}
  .name{font-weight:700;font-size:1.05rem}
  .role{display:inline-block;margin-top:2px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--c);border:1px solid var(--c)}
  .BAT{--c:var(--bat)}.BOWL{--c:var(--bowl)}.ALL{--c:var(--all)}
  .STR{--c:var(--bowl)}.TAC{--c:var(--diamond)}.HYB{--c:var(--all)}
  .src{display:block;font-size:.68rem;color:var(--mute);margin-top:1px}
  .stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
  .stat b{display:block;font-size:.95rem}
  .stat span{font-size:.68rem;color:var(--mute)}
  .price{flex:none;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;border-left:1px solid var(--line)}
  .price b{font-family:var(--head);font-size:1.4rem;color:var(--t)}
  .price span{font-size:.68rem;color:var(--mute)}
  .slider-host{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:50}
  .slider-card{width:min(360px,92%);background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:7px 8px 0;
    box-shadow:0 -8px 30px #000a;transform:translateY(130%);transition:transform .3s ease-out;overflow:hidden}
  .slider-card.in{transform:none}
  .sc-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 5px;font-family:var(--head);letter-spacing:.05em}
  .sc-head span{color:var(--gold);font-size:.85rem}.sc-head b{font-size:.95rem}
  .slider-card .card{margin:0}
  .slider-card .card .left{width:56px;padding:4px 0;gap:2px}
  .slider-card .tier{font-size:.8rem}.slider-card .stars{font-size:.62rem}
  .slider-card .card .body{padding:6px 8px}
  .slider-card .name{font-size:.88rem}
  .slider-card .role{font-size:.6rem;padding:0 6px;margin-top:1px}
  .slider-card .stats{gap:2px 8px;margin-top:4px}
  .slider-card .stat b{font-size:.72rem}.slider-card .stat span{font-size:.56rem}
  .slider-card .price{padding:6px 8px}
  .slider-card .price b{font-size:1rem}.slider-card .price span{font-size:.56rem}
  .sc-bar{height:3px;margin:6px -8px 0;background:var(--line)}
  .sc-bar i{display:block;height:100%;background:var(--ball);animation:sc-shrink linear forwards}
  @keyframes sc-shrink{from{width:100%}to{width:0}}
  @media(prefers-reduced-motion:reduce){.slider-card{transition:none}}
  .wide{width:min(640px,100%)!important}
  .trow{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:8px}
  .sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
  .swatch.on{border-color:#fff}
  .bidbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-family:var(--head);font-size:1.5rem}
  .bidbox small{color:var(--mute);font-family:system-ui,sans-serif;font-size:.8rem;margin-left:8px}
  .tn{display:flex;justify-content:space-between;gap:8px;font-weight:700}
  .tn span{font-size:.75rem;color:var(--mute);font-weight:600}
  .pu{margin:6px 0;font-family:var(--head);font-size:1.25rem}
  .pu small{font-family:system-ui,sans-serif;color:var(--mute);font-size:.72rem;display:block}
  .p-low .pu{color:var(--gold)}
  .mystatus{font-size:.68rem;color:var(--mute);margin:-2px 0 6px;min-height:1em}
  .p-empty{background:#2b2118;border-top-color:#6b4a2f;color:#a98a6a}
  .tb{display:flex;gap:6px}
  .tb button{flex:1;padding:8px 4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.8rem}
  .tb button[data-a=bid]{background:var(--ball);border-color:var(--ball);flex:1.7}
  .tb button:disabled{opacity:.35;cursor:not-allowed}
  .tvt{border-left:4px solid var(--tc);background:var(--card);padding:8px 12px;margin-bottom:10px;border-radius:6px}
  .tvh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .tvh span{color:var(--mute);font-size:.85rem}
  .tvs{font-size:.85rem;padding:2px 0;display:flex;gap:8px;align-items:center}
  .tvs em{color:var(--mute);font-style:normal}.tvs i{color:var(--mute)}
  .toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none}
  .toast{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:3px 10px;border-radius:99px;font-size:.68rem;max-width:80%;font-family:system-ui,sans-serif}
  .tr{position:fixed;inset:0;z-index:100;background:var(--bg);border-left:10px solid var(--tc);display:flex;align-items:center;justify-content:center;transform:translateX(-100%);transition:transform .22s ease}
  .tr.in{transform:none}.tr.out{transform:translateX(100%)}
  .tr-in{text-align:center;padding:20px}.tr-in small{display:block;color:var(--mute);min-height:1.2em}
  .tr-in h2{font-family:var(--head);font-size:clamp(2rem,8vw,3.6rem);margin:8px 0;color:var(--tc)}
  .tr-in p{margin:0;color:var(--mute)}
  @media(prefers-reduced-motion:reduce){.tr{transition:none}}
  .mybox{background:var(--card);border:1px solid var(--gold);border-top:5px solid var(--tc);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .mybox .tn{font-family:var(--head);font-size:1.3rem;align-items:baseline}
  .mybox .tn span{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);font-weight:600}
  .mybox .pu{font-size:1.6rem;margin:4px 0}
  .mybox .tb button{padding:14px 6px;font-size:.95rem;border-radius:8px}
  .oprows{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .oprow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;padding:8px 12px;font-size:.9rem}
  .oprow.lead{border-left-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .oprow em{font-style:normal;color:var(--mute);font-size:.78rem}
  .standings{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:16px}
  .standings[hidden]{display:none}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .rk{font-family:var(--head);font-size:1.1rem;color:var(--gold);width:22px}
  .srow .sn{flex:1;font-weight:700}.srow .sn small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
  .srow .sc{font-family:var(--head);font-size:1.15rem}
  .toprow{display:flex;gap:8px;flex-wrap:wrap}
  .res-hero{text-align:center;padding:34px 16px 18px}
  .res-hero h1{font-family:var(--head);font-size:clamp(2.2rem,10vw,3.6rem);margin:6px 0;color:var(--gold)}
  .res-hero.lose h1{color:var(--mute)}
  .confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti{position:absolute;top:-20px;width:8px;height:14px;opacity:.9;animation:conf-fall linear forwards}
  @keyframes conf-fall{to{transform:translateY(110vh) rotate(540deg);opacity:.3}}
  .res-score{font-family:var(--head);font-size:2.2rem;text-align:center;margin:6px 0 2px}
  .res-why{max-width:420px;margin:0 auto 20px;text-align:center;color:var(--mute);font-size:.88rem}
  .res-mine{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold)}
  .res-opp{opacity:.8}
  .abar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 12px;overflow:hidden}
  .abar i{display:block;height:100%;background:var(--gold)}
  .achars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .achip{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:.88rem}
  .achip.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .achip.placed{opacity:.35}

  /* ===== Line-up screen: countdown ring, drag and drop, live scores (compact, fits one screen) ===== */
  .ax{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;padding-bottom:110px}
  .ax-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .ax-ring{position:relative;width:54px;height:54px;flex:none;--rc:var(--gold)}
  .ax-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ax-ring circle{fill:none;stroke-width:6}.ax-ring .bg{stroke:var(--line)}
  .ax-ring .fg{stroke:var(--rc);stroke-linecap:round;transition:stroke .3s}
  .ax-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:1.1rem;color:var(--rc)}
  .ax-ring.warn{--rc:var(--bat)}.ax-ring.crit{--rc:var(--bowl);animation:axp .5s ease-in-out infinite alternate}
  @keyframes axp{to{transform:scale(1.07)}}
  .ax-info{flex:1;min-width:0}.ax-info h2{margin:0;font-size:1.05rem}.ax-info p{margin:2px 0 0;color:var(--mute);font-size:.78rem}
  .ax-hint{font-size:.72rem;color:var(--mute);margin:0 0 8px}
  .ax-lbl{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:8px 0 5px}
  .ax-src{font-size:.62rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ax-score{text-align:right}.ax-score b{display:block;font-family:var(--head);font-size:1.4rem;color:var(--gold);line-height:1}.ax-score span{font-size:.58rem;color:var(--mute)}
  .ax-tray{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .ax-chip{touch-action:pan-y;cursor:grab;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--t,var(--line));border-radius:8px;padding:8px 8px;min-width:0;transition:transform .12s,opacity .12s}
  .ax-chip b{font-size:.78rem;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ax-chip small{font-size:.6rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.ax-chip span{font-size:.64rem;color:var(--t,var(--mute))}
  .ax-chip.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .ax-chip.placed{opacity:.25}.ax-chip.lift,.ax-slot.lift{opacity:.15}
  .ax-slots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .ax-slot{touch-action:pan-y;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 9px;min-width:0;transition:border-color .12s,background .12s}
  .ax-slot.ready{border-color:#3d6b52}
  .ax-slot.over{border-color:var(--gold);background:#1d3a2b}
  .ax-slot.filled{border-style:solid;border-color:var(--t,var(--gold));background:var(--panel);cursor:grab}
  .ax-an{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .ax-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:2px}
  .ax-cn{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ax-cn.dim,.dim{color:var(--mute);font-weight:400}
  .ax-row em{font-style:normal;font-family:var(--head);font-size:.85rem;flex:none}.ax-row em.dim{opacity:.7}
  .hi{color:var(--emerald)}.mid{color:var(--bat)}.lo{color:var(--bowl)}
  .ax-lock{width:100%;margin-top:14px;padding:11px}
  .ax-lock.go{animation:axg 1.2s ease-in-out infinite}
  @keyframes axg{50%{box-shadow:0 0 0 4px #d8402f44}}
  .ax-ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;will-change:transform;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--gold);border-left:4px solid var(--t,var(--gold));border-radius:10px;padding:11px 16px;font-size:.95rem;box-shadow:0 14px 30px #000c}.ax-ghost span{color:var(--mute);font-size:.8rem}
  .handoff{text-align:center}.handoff .av{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:2.2rem;color:#0d1a14;font-weight:700}
  .aispin{width:40px;height:40px;margin:14px auto;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:axs .8s linear infinite}
  @keyframes axs{to{transform:rotate(360deg)}}
  .aslots{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .aslot{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem}
  .aslot.filled{border-style:solid;border-color:var(--gold)}
  .aslot span{color:var(--mute)}
  .aslot.filled span{color:var(--text);font-weight:700}
  .brow{padding:8px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .brow b{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
  .bcells{display:flex;flex-wrap:wrap;gap:6px}
  .bcell{font-size:.82rem;padding:4px 9px;border-radius:6px;border-left:3px solid var(--tc);background:var(--panel)}
  .bcell em{font-style:normal;font-weight:700;margin-left:6px}
  .bcell.win{box-shadow:0 0 0 1px var(--gold)}
  .cstat{font-size:.85rem;color:var(--mute);margin:-8px 0 16px}
  .cstat b{color:var(--gold)}
  .lbtn{display:block;text-align:center;cursor:pointer}

  /* ===== Auction screen polish: more air, one clear focus, quieter secondary actions ===== */
  #app{padding:12px 14px}
  .room{margin-bottom:10px}
  .room h2{font-size:1.4rem;letter-spacing:.02em}
  .room .btn{font-size:.78rem;padding:6px 12px;border-radius:99px;background:transparent;color:var(--mute)}
  .room .btn:hover{color:var(--text);filter:none;border-color:var(--mute)}
  .toprow{display:flex;gap:8px}
  .bidbox{padding:10px 14px;margin-bottom:10px;border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--card))}
  .bb-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .bb-tag{font-size:.65rem;letter-spacing:.1em;color:var(--ball);font-family:system-ui,sans-serif;font-weight:700}
  .bbl{margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--mute);font-family:system-ui,sans-serif;font-size:.95rem;line-height:1.35}
  .bbl.hi{border-left-color:var(--tc,var(--gold))}
  .bbl b{font-family:var(--head);font-size:1.15rem;font-weight:400}
  .bbl small,.lastsale small{display:block;margin:0 0 2px;font-size:.62rem;letter-spacing:.1em;color:var(--mute)}
  .lastsale{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:4px solid #c0392b;font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.35}
  .lastsale.sold{border-left-color:#2ecc71}
  .bidbox{text-align:center;padding:16px 14px 14px!important}
  .bb-who{font-size:.8rem;color:var(--mute);letter-spacing:.04em;margin-bottom:10px}
  .bb-lbl{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .bb-amt{font-family:var(--head);font-weight:600;font-size:2.4rem;line-height:1.15;margin:4px 0 2px}
  .bb-by{font-family:var(--head);font-weight:500;font-size:1.2rem}
  .bb-by.dim{color:var(--mute);font-size:.85rem;font-weight:400}
  .bb-next{font-size:.8rem;color:var(--mute);margin-top:8px;min-height:1em}
  .tr.fade{transform:none;opacity:0;transition:opacity .28s ease;border-left:0;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tc) 22%,var(--bg)),var(--bg) 70%)}
  .tr.fade.in{opacity:1}.tr.fade.out{opacity:0;transform:none}
  .sold-in{text-align:center;padding:24px;max-width:520px}

<script>
/* ================= Helpers ================= */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(msg) {
  let h = document.querySelector(".toasts");
  if (!h) { h = document.createElement("div"); h.className = "toasts"; document.body.appendChild(h); }
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

/* ================= CharacterFactory =================
   Holds the real character dataset (your JSON: name, anime, 20 attributes each).
   load(json) accepts the array from your file, keeps it in memory and remembers it in this browser.
   Everything else (PlayerFactory, AttributeFactory) reads characters only through this factory. */
const CharacterFactory = (() => {
  const KEY = "characterDB.v1";

  function load(raw) {
    const next = clean(raw); if (!next.length) return 0;
    chars = next;

  function restore() {

      if (localStorage.getItem(EMB_KEY) !== EMB_VER) { localStorage.removeItem(KEY); load(embedded()); localStorage.setItem(EMB_KEY, EMB_VER); }
      else { const s = localStorage.getItem(KEY); if (s) load(JSON.parse(s)); }

  const overall = c => { const v = Object.values(c.attrs); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
  return { load, restore, forget, overall, total, getAll: () => chars.slice(), count: () => chars.length,
           shows: () => new Set(chars.map(c => c.anime)).size };

/* ================= PlayerFactory ================= */
const PlayerFactory = (() => {
  const TIERS = { diamond: "Diamond", emerald: "Emerald", gold: "Gold", silver: "Silver", bronze: "Bronze" };
  const RATING_PRICE = { 5: 2.0, 4: 1.5, 3: 1.0, 2: 0.5, 1: 0.2 };   // crore
  const MODES = {
    cricket: {
      roles: { ALL: "All-rounder", BAT: "Batsman", BOWL: "Bowler" },
      stats: {
        BAT:  { matches: "Matches", runs: "Runs", average: "Bat avg", strikeRate: "Strike rate", hundreds: "100s" },
        BOWL: { matches: "Matches", wickets: "Wickets", average: "Bowl avg", economy: "Economy", best: "Best" },
        ALL:  { runs: "Runs", batAvg: "Bat avg", wickets: "Wickets", economy: "Economy", matches: "Matches" }
      }
    },
    anime: {
      roles: { HYB: "All-Rounder", STR: "Powerhouse", TAC: "Tactician" },
      stats: {
        STR: { power: "Strength", speed: "Speed", hax: "Hax" },
        TAC: { iq: "Battle IQ", precision: "Precision", hax: "Hax" },
        HYB: { power: "Strength", iq: "Battle IQ", hax: "Hax" }
      }
    }
  };
  let mode = "anime", ROLES = MODES.anime.roles, STAT_SCHEMA = MODES.anime.stats;
  let nextId = 1, list = [];

  function create(name, role, tier, rating, stats, source, core, ability) {
    if (!ROLES[role]) throw new Error("Unknown role: " + role);
    if (!TIERS[tier]) throw new Error("Unknown tier: " + tier);
    if (!RATING_PRICE[rating]) throw new Error("Rating must be 1-5");
    const clean = {};
    for (const k in STAT_SCHEMA[role]) clean[k] = stats[k] ?? "-";
    const p = { id: nextId++, name, role, roleLabel: ROLES[role], tier, tierLabel: TIERS[tier],
                rating, basePrice: RATING_PRICE[rating], stats: clean, source: source || "", core: core || null, ability: ability || "",
                total: core ? Object.values(core).reduce((a, b) => a + (+b || 0), 0) : null };
    list.push(p);
    return p;
  }

  function seedCricket() {
    create("Virat Kohli",       "BAT",  "diamond", 5, { matches: 252, runs: 8004, average: 38.7, strikeRate: 131.9, hundreds: 8 });
    create("Rohit Sharma",      "BAT",  "diamond", 5, { matches: 257, runs: 6628, average: 29.7, strikeRate: 130.4, hundreds: 2 });
    create("Jasprit Bumrah",    "BOWL", "diamond", 5, { matches: 133, wickets: 165, average: 22.5, economy: 7.4, best: "5/10" });
    create("Suryakumar Yadav",  "BAT",  "gold",    4, { matches: 150, runs: 3594, average: 32.0, strikeRate: 145.5, hundreds: 2 });
    create("Hardik Pandya",     "ALL",  "gold",    4, { runs: 2525, batAvg: 27.5, wickets: 64,  economy: 9.1, matches: 137 });
    create("Ravindra Jadeja",   "ALL",  "gold",    4, { runs: 2959, batAvg: 27.4, wickets: 160, economy: 7.6, matches: 240 });
    create("Rashid Khan",       "BOWL", "gold",    4, { matches: 121, wickets: 149, average: 22.0, economy: 6.8, best: "3/19" });
    create("Andre Russell",     "ALL",  "silver",  3, { runs: 2484, batAvg: 28.5, wickets: 115, economy: 9.2, matches: 140 });
    create("Trent Boult",       "BOWL", "silver",  3, { matches: 100, wickets: 120, average: 26.0, economy: 8.3, best: "4/18" });
    create("Yuzvendra Chahal",  "BOWL", "silver",  3, { matches: 160, wickets: 205, average: 22.0, economy: 7.9, best: "5/40" });
    create("Tilak Varma",       "BAT",  "bronze",  2, { matches: 50, runs: 1400, average: 36.0, strikeRate: 143.0, hundreds: 0 });
    create("Harshit Rana",      "BOWL", "bronze",  1, { matches: 25, wickets: 30, average: 26.0, economy: 9.3, best: "3/33" });
  }

  // Anime pack: built only from the real dataset in CharacterFactory. Tier = total of all 20 attributes (max 2000):
  // Diamond 1600+, Emerald 1400-1599, Gold 1000-1399, Silver 600-999, Bronze below 600.
  // Role comes from the attributes: bruiser (Strength/Durability) vs thinker (Battle IQ/Precision).
  // Each card shows two random attributes out of the 20 (re-rolled for every new auction).
  const pickShown = a => shuffle(Object.keys(a)).slice(0, 2).map(k => [k, a[k]]);
  const reroll = () => list.forEach(p => { if (p.core) p.shown = pickShown(p.core); });
  const STAR_CUTS = { 5: 1600, 4: 1400, 3: 1000, 2: 600 };
  function seedAnime() {
    const all = CharacterFactory.getAll().sort((a, b) => CharacterFactory.total(b) - CharacterFactory.total(a));
    all.forEach(c => {
      // STAR CUTS: total of all 20 attributes (max 2000). Change these four numbers to move the star boundaries.
      const tot = CharacterFactory.total(c), a = c.attrs;
      const rating = tot >= STAR_CUTS[5] ? 5 : tot >= STAR_CUTS[4] ? 4 : tot >= STAR_CUTS[3] ? 3 : tot >= STAR_CUTS[2] ? 2 : 1;
      const tier = { 5: "diamond", 4: "emerald", 3: "gold", 2: "silver", 1: "bronze" }[rating];
      const brawn = ((a.Strength || 0) + (a.Durability || 0)) / 2, brain = ((a["Battle IQ"] || 0) + (a.Precision || 0)) / 2;
      const role = brawn - brain > 12 ? "STR" : brain - brawn > 12 ? "TAC" : "HYB";
      const stats = { power: a.Strength, speed: a.Speed, iq: a["Battle IQ"], precision: a.Precision, hax: a["Hax Potential"] };
      // Stars are now 5/4/3/2/1 by tier, but base prices stay as they were so the auction economy does not change.
      const pl = create(c.name, role, tier, rating, stats, c.anime, a, c.ability);
      pl.basePrice = { diamond: 2.0, emerald: 1.5, gold: 1.5, silver: 1.0, bronze: 0.5 }[tier];
      pl.shown = pickShown(a);
    });
    shuffle(list);
  }

  function setMode(m) {
    if (!MODES[m]) throw new Error("Unknown mode: " + m);
    mode = m; ROLES = MODES[m].roles; STAT_SCHEMA = MODES[m].stats; list = []; nextId = 1;
    if (m === "cricket") seedCricket(); else seedAnime();
  }
  return { create, roles: () => Object.keys(ROLES), roleLabel: r => ROLES[r], getAll: () => list.slice(), getById: id => list.find(p => p.id === id),
           getByTier: t => list.filter(p => p.tier === t), labelsFor: r => STAT_SCHEMA[r], setMode, reroll, mode: () => mode, modes: () => Object.keys(MODES) };
})();

/* ================= AttributeFactory =================
   The 20 battle attributes. Scores are the real per-character numbers from the dataset
   (character.core[label]); nothing is calculated or invented. pick(n) draws n random attributes for a game. */
const AttributeFactory = (() => {
  const LABELS = { strength: "Strength", speed: "Speed", durability: "Durability", battleIQ: "Battle IQ", abilityPower: "Ability Power",
    weaponMastery: "Weapon Mastery", stamina: "Stamina", reflexes: "Reflexes", willpower: "Willpower", regeneration: "Regeneration",
    range: "Range", combat: "Combat", experience: "Experience", instinct: "Instinct", precision: "Precision",
    intimidation: "Intimidation", haxPotential: "Hax Potential", iq: "IQ", adaptability: "Adaptability", endurance: "Endurance" };
  const score = (p, id) => (p && p.core && LABELS[id] && +p.core[LABELS[id]]) || 0;
  const pick = n => shuffle(Object.keys(LABELS)).slice(0, Math.max(1, Math.min(n, Object.keys(LABELS).length)));
  return { pool: () => LABELS, label: id => LABELS[id], score, pick };
})();


/* ================= StoneFactory (Mega Stones, steps 1-2) =================
   Self-contained. Nothing else in the game calls it yet, so it cannot break anything.
   To remove the whole feature: set enabled=false, or delete this block, renderStoneCard(), the "MEGA STONES" CSS and the preview at the end.
   pool = related attributes (ids from AttributeFactory). Later: 3 random from the pool go up, 3 others go down. */
const StoneFactory = (() => {
  const config = { enabled: true, basePrice: 1.0, minChange: 20, maxChange: 40, upCount: 3, downCount: 3,
    count: 1,          // stones added to each auction (every type at least once, the rest random repeats)
    minStart: 3,       // no stone in the first lots
    windowPerSlot: 3 };// stones appear within the first (teams x slots x 3) lots, the part of the queue that is really played
  const DEFS = {
    mega: { name: "Mega Stone Card", icon: "💎", color: "#ff5ad1", blurb: "Rare. Pure chaos across all attributes",
      pool: Object.keys(AttributeFactory.pool()) }
  };
  const ids = () => Object.keys(DEFS);
  const get = id => DEFS[id] || null;
  let n = 0;
  /* a stone "lot" is what will sit in the auction queue later (step 3) */
  const createLot = id => { const d = DEFS[id]; if (!d) return null;
    /* looks like a player (id, name, tier, basePrice) so bidding, purse, snapshots and the network need no changes */
    return { kind: "stone", id: "stone-" + (++n) + "-" + Date.now().toString(36), stoneId: id, name: d.name, source: "Mega Stone",
      tier: "stone", tierLabel: "Mega Stone", role: "stone", roleLabel: "Mega Stone", rating: 0,
      icon: d.icon, color: d.color, blurb: d.blurb, pool: d.pool.slice(), basePrice: config.basePrice }; };
  const isStone = x => !!x && x.kind === "stone";
  /* puts stones at random spots inside the part of the queue that will really be auctioned */
  function mixInto(queue, teams) {
    if (!config.enabled) return queue;
    const slots = teams.length ? teams[0].slots.length : 6;
    const win = Math.min(queue.length, Math.max(30, teams.length * slots * config.windowPerSlot));
    const list = shuffle(ids());
    while (list.length < config.count) list.push(randomId());
    list.slice(0, config.count).forEach(id => {
      const pos = config.minStart + Math.floor(Math.random() * Math.max(1, win - config.minStart));
      queue.splice(pos, 0, createLot(id));
    });
    return queue;
  }
  const randomId = () => ids()[Math.floor(Math.random() * ids().length)];
  /* step 4: what a team owns. Stones live in team.stones (added when a stone is won in the auction) */
  const ownedOf = t => (t && t.stones) || [];
  const counts = t => { const c = {}; ownedOf(t).forEach(x => { c[x.stoneId] = (c[x.stoneId] || 0) + 1; }); return c; };
  /* small chips like  💪 Strength ×2 . names=false gives icons only (for tight spaces) */
  function ownedHtml(t, names = true) {
    const c = counts(t), keys = ids().filter(k => c[k]);
    if (!keys.length) return "";
    return `<div class="ochips">${keys.map(k => { const d = DEFS[k];
      return `<span class="ochip" style="--t:${d.color}" title="${esc(d.name)}">${d.icon}${names ? " " + esc(d.name.replace(" Stone", "")) : ""}${c[k] > 1 ? " ×" + c[k] : ""}</span>`; }).join("")}</div>`;
  }
  /* step 6: the roll. It is SEEDED by (stone id + character id), so the same stone on the same character always gives the same
     result. That means the host can recompute it later (step 8) and nobody can re-roll or cheat. */
  function rngFor(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    let a = (h ^= h >>> 16) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  /* 3 random attributes from the stone's pool go up, 3 different ones go down. Scores stay inside 1..100 and delta is the real change. */
  function roll(stone, char) {
    const rnd = rngFor(stone.id + "|" + (char && char.id)), pool = stone.pool.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const one = (id, dir) => { const from = AttributeFactory.score(char, id), amt = config.minChange + Math.floor(rnd() * (config.maxChange - config.minChange + 1));
      const to = Math.max(1, Math.min(100, from + dir * amt)); return { id, label: AttributeFactory.label(id), from, to, delta: Math.abs(to - from) }; };
    const ups = pool.slice(0, config.upCount).map(id => one(id, 1));
    const downs = pool.slice(config.upCount, config.upCount + config.downCount).map(id => one(id, -1));
    return { stoneId: stone.id, type: stone.stoneId, charId: char && char.id, ups, downs };
  }
  /* step 8: scoring. The host (and every screen) recomputes rolls from ids, so nothing sent by a player is trusted except "stone X on slot Y". */
  function validate(team, picks, map) {
    const owned = new Set(ownedOf(team).map(x => x.id)), used = new Set(), out = {};
    Object.entries(map || {}).forEach(([attr, v]) => { const id = v && typeof v === "object" ? v.id : v;
      if (picks && picks[attr] != null && owned.has(id) && !used.has(id)) { used.add(id); out[attr] = id; } });
    return out;
  }
  function rolls(team, picks, map) {
    const out = {}, chars = team.slots.map(sl => sl.player).filter(Boolean);
    Object.entries(validate(team, picks, map)).forEach(([attr, id]) => {
      const stone = ownedOf(team).find(x => x.id === id), c = chars.find(x => x.id === picks[attr]);
      if (stone && c) out[attr] = roll(stone, c); });
    return out;
  }
  /* what a rolled stone does to the slot's own attribute: {dir, from, to, delta} or null when that attribute was not rolled */
  function effectOn(r, attr) {
    if (!r) return null;
    const u = r.ups.find(x => x.id === attr); if (u) return { dir: "up", from: u.from, to: u.to, delta: u.delta };
    const d = r.downs.find(x => x.id === attr); if (d) return { dir: "dn", from: d.from, to: d.to, delta: d.delta };
    return null;
  }
  return { config, ids, get, createLot, randomId, isStone, mixInto, ownedOf, counts, ownedHtml, roll, validate, rolls, effectOn };
})();

/* ================= TeamFactory ================= */
const TeamFactory = (() => {
  const config = { mismatchPenalty: 0.6,
    palette: ["#e4574a", "#3cc4b0", "#f2b134", "#7fdcff", "#b48cf2", "#8ad06a", "#f28cb8", "#f0803c", "#5f8cf2", "#c9c9c9"] };
  let nextId = 1;
  function roleQuota(slotCount, roles = PlayerFactory.roles()) {
    const q = {}, base = Math.floor(slotCount / roles.length);
    let extra = slotCount % roles.length;
    roles.forEach(r => { q[r] = base + (extra-- > 0 ? 1 : 0); });
    return q;
  }
  function create({ name, color, owner = null, slotCount = 6, roles } = {}) {
    const quota = roleQuota(slotCount, roles), slots = [];
    for (const r in quota) for (let i = 0; i < quota[r]; i++) slots.push({ id: slots.length + 1, role: r, player: null });
    const id = nextId++;
    return { id, name: name || "Team " + id, color: color || config.palette[(id - 1) % config.palette.length], owner, quota, slots };
  }
  const createMany = (count, slotCount, opts = {}) => Array.from({ length: count }, () => create({ ...opts, slotCount }));
  function addPlayer(team, player, slotId) {
    if (team.slots.some(s => s.player && s.player.id === player.id)) return { ok: false, reason: "Already in this team" };
    const empty = team.slots.filter(s => !s.player);
    const slot = slotId ? empty.find(s => s.id === slotId) : (empty.find(s => s.role === player.role) || empty[0]);
    if (!slot) return { ok: false, reason: slotId ? "Slot not available" : "Your slots are full" };
    slot.player = player;
    return { ok: true, slot };
  }
  function removePlayer(team, slotId) {
    const slot = team.slots.find(s => s.id === slotId);
    const removed = slot ? slot.player : null;
    if (slot) slot.player = null;
    return removed;
  }
  const slotScore = slot => !slot.player ? 0 : (slot.player.rating / 5) * (slot.player.role === slot.role ? 1 : config.mismatchPenalty);
  const overall = team => Math.round(100 * team.slots.reduce((sum, s) => sum + slotScore(s), 0) / team.slots.length);
  const roleCounts = team => {
    const c = {}; Object.keys(team.quota).forEach(r => c[r] = 0);
    team.slots.forEach(s => { if (s.player) c[s.player.role] = (c[s.player.role] || 0) + 1; });
    return c;
  };
  const filledCount = team => team.slots.filter(s => s.player).length;
  const isFull = team => filledCount(team) === team.slots.length;
  const setName = (team, name) => { team.name = String(name).trim().slice(0, 20) || team.name; return team; };
  const setColor = (team, color) => { if (/^#[0-9a-f]{6}$/i.test(color)) team.color = color; return team; };
  return { config, roleQuota, create, createMany, addPlayer, removePlayer, slotScore, overall, roleCounts, filledCount, isFull, setName, setColor };
})();

/* ================= RankFactory ================= */
const RankFactory = (() => {
  const config = { starWeight: 0.65, diversityWeight: 0.35 };
  // A player's overall (0-100) = total of all 20 attributes out of 2000. Cricket players have no attributes, so they fall back to stars.
  const playerOverall = p => p.total != null ? p.total / 20 : p.rating * 20;
  function starScore(team) {
    const filled = team.slots.filter(s => s.player);
    if (!filled.length) return 0;
    return Math.round(filled.reduce((sum, s) => sum + playerOverall(s.player), 0) / filled.length);
  }
  function diversityScore(team) {
    const counts = TeamFactory.roleCounts(team), roles = Object.keys(team.quota);
    const filled = TeamFactory.filledCount(team);
    if (!filled) return 0;
    let penalty = 0;
    roles.forEach(r => { const want = team.quota[r] ? team.quota[r] / team.slots.length : 0;
      penalty += Math.abs((counts[r] || 0) / filled - want); });
    return Math.round(100 * Math.max(0, 1 - penalty / 2));
  }
  function score(team) {
    const stars = starScore(team), diversity = diversityScore(team);
    return { stars, diversity, total: Math.round(stars * config.starWeight + diversity * config.diversityWeight) };
  }
  const rank = teams => teams.map(t => ({ team: t, ...score(t) })).sort((a, b) => b.total - a.total).map((r, i) => ({ ...r, rank: i + 1 }));
  return { config, score, rank };
})();

/* ================= PurseFactory ================= */
const PurseFactory = (() => {
  const config = { symbol: "₹", unit: "Cr", lowPercent: 0.10 };
  const round = n => Math.round(n * 100) / 100;
  const format = n => config.symbol + round(n) + " " + config.unit;
  function create(teamId, total) {
    total = round(+total);
    if (!(total > 0)) throw new Error("Purse must be more than 0");
    return { teamId, total, remaining: total, spent: 0, lowWarned: false, blockedIds: [], history: [] };
  }
  const createMany = (teams, total) => Object.fromEntries(teams.map(t => [t.id, create(t.id, total)]));
  const lowThreshold = p => round(p.total * config.lowPercent);
  const isLow = p => p.remaining <= lowThreshold(p);
  const canAfford = (p, price) => price > 0 && price <= p.remaining;
  const status = (p, minPrice = 0) => (p.remaining <= 0 || (minPrice && p.remaining < minPrice)) ? "empty" : isLow(p) ? "low" : "ok";
  function affordability(p, players, priceOf = pl => pl.basePrice) {
    const can = [], cant = [];
    players.forEach(pl => (canAfford(p, priceOf(pl)) ? can : cant).push(pl));
    return { can, cant };
  }
  function spend(p, price, player = null, pool = null) {
    price = round(+price);
    if (!(price > 0)) return { ok: false, reason: "Invalid amount", warnings: [] };
    if (price > p.remaining) return { ok: false, reason: "Not enough money", warnings: [] };
    p.remaining = round(p.remaining - price);
    p.spent = round(p.spent + price);
    p.history.push({ playerId: player ? player.id : null, price });
    const warnings = [];
    if (!p.lowWarned && isLow(p)) { p.lowWarned = true; warnings.push({ type: "low", message: `Low purse: only ${format(p.remaining)} left` }); }
    if (pool) {
      const fresh = affordability(p, pool).cant.filter(pl => !p.blockedIds.includes(pl.id));
      if (fresh.length) { fresh.forEach(pl => p.blockedIds.push(pl.id));
        warnings.push({ type: "blocked", players: fresh, message: `Not enough purse for: ${fresh.map(pl => pl.name).join(", ")}` }); }
    }
    return { ok: true, remaining: p.remaining, warnings };
  }
  function refund(p, playerId) {
    const i = p.history.findIndex(h => h.playerId === playerId);
    if (i < 0) return { ok: false, reason: "No purchase found" };
    const [h] = p.history.splice(i, 1);
    p.remaining = round(p.remaining + h.price);
    p.spent = round(p.spent - h.price);
    return { ok: true, remaining: p.remaining };
  }
  return { config, format, create, createMany, lowThreshold, isLow, canAfford, status, affordability, spend, refund };
})();

/* ================= SliderCardFactory ================= */
const SliderCardFactory = (() => {
  let host = null, current = null;
  function show({ html, label = "Up next", seconds = 15, onDone } = {}) {
    if (!host) { host = document.createElement("div"); host.className = "slider-host"; document.body.appendChild(host); }
    if (current) current.close(false);
    const el = document.createElement("div");
    el.className = "slider-card";
    el.innerHTML = `<div class="sc-head"><span>${label}</span><b>${seconds}s</b></div>${html}
      <div class="sc-bar"><i style="animation-duration:${seconds}s"></i></div>`;
    host.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
    let left = seconds;
    const label$ = el.querySelector(".sc-head b");
    const tick = setInterval(() => { left--; label$.textContent = Math.max(left, 0) + "s"; if (left <= 0) handle.close(true); }, 1000);
    const handle = {
      reset(sec, lab) {
        left = sec; label$.textContent = sec + "s";
        if (lab) el.querySelector(".sc-head span").textContent = lab;
        const i = el.querySelector(".sc-bar i"); i.style.animation = "none"; void i.offsetWidth;
        i.style.animation = ""; i.style.animationDuration = sec + "s";
      },
      close(finished) {
        if (current !== handle) return;
        clearInterval(tick); current = null;
        el.classList.remove("in"); setTimeout(() => el.remove(), 350);
        if (onDone) onDone(finished);
      }
    };
    current = handle;
    return handle;
  }
  const showPlayer = (player, seconds, opts = {}) => show({ html: renderPlayerCard(player), seconds, ...opts });
  const hide = () => { if (current) current.close(false); };
  return { show, showPlayer, hide };
})();

/* ================= BidFactory / SkipFactory / WithdrawFactory ================= */
const BidFactory = (() => {
  const config = { bidSeconds: 50, increment: 0.25 };
  const r2 = n => Math.round(n * 100) / 100;
  const leader = lot => lot.bids.length ? lot.bids[lot.bids.length - 1] : null;
  const nextAmount = lot => leader(lot) ? r2(leader(lot).amount + config.increment) : lot.player.basePrice;
  const createLot = (player, teamIds, ineligible = {}) => ({ player, teamIds, bids: [], out: { ...ineligible }, status: "open" });
  function bid(lot, teamId, purse) {
    if (lot.status !== "open") return { ok: false, reason: "Bidding is closed" };
    if (lot.out[teamId]) return { ok: false, reason: "You are out of this player" };
    if (leader(lot) && leader(lot).teamId === teamId) return { ok: false, reason: "You already lead" };
    const amount = nextAmount(lot);
    if (!PurseFactory.canAfford(purse, amount)) return { ok: false, reason: "Not enough purse" };
    lot.bids.push({ teamId, amount });
    return { ok: true, amount };
  }
  function resolve(lot) {
    const active = lot.teamIds.filter(id => !lot.out[id]), lead = leader(lot);
    if (!lead) return active.length ? null : "unsold";
    return active.every(id => id === lead.teamId) ? "sold" : null;
  }
  const close = lot => leader(lot) ? "sold" : "unsold";
  return { config, leader, nextAmount, createLot, bid, resolve, close };
})();

const SkipFactory = {
  skip(lot, teamId) {
    if (lot.status !== "open" || lot.out[teamId]) return { ok: false, reason: "Can't skip now" };
    if (lot.bids.some(b => b.teamId === teamId)) return { ok: false, reason: "You bid already. Use withdraw" };
    lot.out[teamId] = "Skipped";
    return { ok: true };
  }
};
const WithdrawFactory = {
  withdraw(lot, teamId) {
    if (lot.status !== "open" || lot.out[teamId] || !lot.bids.some(b => b.teamId === teamId)) return { ok: false, reason: "Nothing to withdraw" };
    lot.bids = lot.bids.filter(b => b.teamId !== teamId);
    lot.out[teamId] = "Withdrew";
    return { ok: true };
  }
};

/* ================= TransitionFactory ================= */
const TransitionFactory = {
  play(o = {}) {
    if (o.kind === "sold") return TransitionFactory.sold(o);
    const { top = "", title = "", sub = "", color = "var(--gold)" } = o;
    return new Promise(done => {
      const el = document.createElement("div");
      el.className = "tr"; el.style.setProperty("--tc", color);
      el.innerHTML = `<div class="tr-in"><small>${esc(top)}</small><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;
      document.body.appendChild(el);
      const ex = GemFX.fancy(o.tier) ? 700 : 0; GemFX.burst(el, o.tier);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
      setTimeout(() => el.classList.add("out"), 600 + ex);
      setTimeout(() => { el.remove(); done(); }, 850 + ex);
    });
  },
  sold({ unsold, player = "", team = "", color = "var(--gold)", next = null }) {
    return new Promise(done => {
      const el = document.createElement("div");
      el.className = "tr fade"; el.style.setProperty("--tc", unsold ? "var(--mute)" : color);
      const inner = document.createElement("div"); inner.className = "sold-in"; inner.style.transition = "opacity .15s ease";
      inner.innerHTML = unsold
        ? `<div class="s-line">${esc(player)} <span>unsold</span></div>`
        : `<div class="s-line">${esc(player)} <span>sold to</span> <b>${esc(team)}</b></div>`;
      el.appendChild(inner);
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
      let t = 900;
      if (next) {
        setTimeout(() => { inner.style.opacity = 0; }, t);
        setTimeout(() => {
          el.style.setProperty("--tc", next.color || "var(--gold)");
          inner.innerHTML = `<div class="tr-in"><small>Up next</small><h2>${esc(next.title)}</h2><p>${esc(next.sub)}</p></div>`;
          inner.style.opacity = 1; GemFX.burst(el, next.tier);
        }, t + 150);
        t += 150 + 700 + (GemFX.fancy(next.tier) ? 700 : 0);
      }
      setTimeout(() => el.classList.remove("in"), t);
      setTimeout(() => { el.remove(); done(); }, t + 280);
    });
  }
};

/* ================= AuctionFactory ================= */
const AuctionFactory = (() => {
  function create({ teams, purses, pool, cardSeconds = 15, hooks = {} }) {
    const queue = StoneFactory.mixInto(shuffle(pool.slice()), teams);
    const A = { teams, purses, queue, total: queue.length, done: 0, lot: null,
                handle: null, results: [], stoneResults: [], pile: [], finished: false, stopped: false };
    const resultsFor = p => StoneFactory.isStone(p) ? A.stoneResults : A.results;
    const emit = () => hooks.onUpdate && hooks.onUpdate(A);
    const teamOf = id => teams.find(t => t.id === id);
    const reason = (t, p) => TeamFactory.isFull(t) ? "Your slots are full" : !PurseFactory.canAfford(purses[t.id], p.basePrice) ? "Not enough money" : null;   // a team with every slot filled is done: it is never asked (characters or stones)

    /* unsold characters wait in A.pile. They can come back (only for the endgame team, see pickNext) and are then removed from the unsold list when bought */
    const markUnsold = p => {
      if (StoneFactory.isStone(p)) { A.stoneResults.push({ player: p, status: "unsold" }); return; }   // an unsold Mega Stone never comes back
      if (!A.pile.includes(p)) A.pile.push(p);
      if (!A.results.some(x => x.player === p && x.status === "unsold")) A.results.push({ player: p, status: "unsold" });
    };
    const dropUnsold = p => { A.pile = A.pile.filter(x => x !== p); for (let i = A.results.length - 1; i >= 0; i--) if (A.results[i].player === p && A.results[i].status === "unsold") A.results.splice(i, 1); };
    /* ENDGAME: when every team but one has all its slots filled, that last team can no longer wait for fresh diamonds at base price.
       It only sees UNSOLD characters (they cycle back in random order, skipped ones return). If the unsold pile is smaller than the slots it
       still has to fill, it may also get that many NEW characters. The one Mega Stone card still appears once, never repeated. */
    function pickNext() {
      const open = teams.filter(t => !TeamFactory.isFull(t));
      if (teams.length < 2 || open.length !== 1) return { p: A.queue.shift(), fromPile: false };
      const L = open[0], need = L.slots.length - TeamFactory.filledCount(L), afford = p => PurseFactory.canAfford(purses[L.id], p.basePrice);
      const opts = A.pile.filter(afford).map(p => ({ p, fromPile: true }));
      if (need > A.pile.length) { const i = A.queue.findIndex(x => !StoneFactory.isStone(x)); if (i >= 0) opts.push({ p: A.queue[i], fromPile: false, qi: i }); }
      const si = A.queue.findIndex(x => StoneFactory.isStone(x)); if (si >= 0) opts.push({ p: A.queue[si], fromPile: false, qi: si });
      if (!opts.length) return null;   // nothing left this team can buy: the auction ends
      const o = opts[Math.floor(Math.random() * opts.length)];
      if (o.fromPile) A.pile = A.pile.filter(x => x !== o.p); else A.queue.splice(o.qi, 1);
      return o;
    }

    async function nextLot(msg, sale) {
      A.lot = null;
      while (!teams.every(t => TeamFactory.isFull(t))) {
        const nx = pickNext(); if (!nx || !nx.p) break;
        const p = nx.p, out = {};
        teams.forEach(t => { const r = reason(t, p); if (r) out[t.id] = r; });
        const lot = BidFactory.createLot(p, teams.map(t => t.id), out); lot.fromPile = nx.fromPile;
        if (BidFactory.resolve(lot)) { if (!nx.fromPile) A.done++; markUnsold(p); msg = "Unsold: " + p.name; continue; }
        emit();
        const tro = { top: sale ? "Up next" : msg, title: p.name, sub: p.tierLabel + " · base " + PurseFactory.format(p.basePrice), color: StoneFactory.isStone(p) ? p.color : `var(--${p.tier})`, tier: p.tier };
        const full = sale ? { ...sale, next: tro } : tro; sale = null;
        hooks.onTransition && hooks.onTransition(full);
        await TransitionFactory.play(full);
        if (A.stopped) return;
        A.lot = lot; A.deadline = Date.now() + cardSeconds * 1000;
        A.handle = SliderCardFactory.showPlayer(p, cardSeconds, { label: "On the block", onDone: ran => { if (ran) endLot(BidFactory.close(lot)); } });
        emit(); return;
      }
      if (sale) { hooks.onTransition && hooks.onTransition(sale); await TransitionFactory.play(sale); if (A.stopped) return; }
      A.finished = true; emit(); hooks.onFinish && hooks.onFinish(A);
    }

    function endLot(result) {
      const lot = A.lot; if (!lot || lot.status !== "open") return;
      lot.status = result; A.lot = null;
      const h = A.handle; A.handle = null; if (h) h.close(false);
      let msg, sale;
      if (result === "sold") {
        const w = BidFactory.leader(lot), t = teamOf(w.teamId);
        if (StoneFactory.isStone(lot.player)) (t.stones = t.stones || []).push(lot.player); else TeamFactory.addPlayer(t, lot.player);
        PurseFactory.spend(purses[t.id], w.amount, lot.player, A.queue.concat(A.pile).filter(x => !StoneFactory.isStone(x))).warnings.forEach(x => hooks.onWarn && hooks.onWarn(t, x));
        if (!StoneFactory.isStone(lot.player)) dropUnsold(lot.player);
        resultsFor(lot.player).push({ player: lot.player, status: "sold", teamId: t.id, price: w.amount });
        msg = "Up next"; sale = { kind: "sold", player: lot.player.name, team: t.name, price: PurseFactory.format(w.amount), color: t.color };
      } else { markUnsold(lot.player); msg = "Up next"; sale = { kind: "sold", unsold: true, player: lot.player.name }; }
      if (!lot.fromPile) A.done++;
      nextLot(msg, sale);
    }

    const action = (fn, retimer) => id => {
      const lot = A.lot; if (!lot || lot.status !== "open") return { ok: false };
      const r = fn(lot, id);
      if (!r.ok) return r;
      if (retimer) { const sec = lot.bids.length ? BidFactory.config.bidSeconds : cardSeconds; A.deadline = Date.now() + sec * 1000; A.handle.reset(sec, lot.bids.length ? "Bidding" : "On the block"); }
      const res = BidFactory.resolve(lot);
      if (res) endLot(res); else emit();
      return r;
    };
    A.bid = action((lot, id) => BidFactory.bid(lot, id, purses[id]), true);
    A.skip = action(SkipFactory.skip, false);
    A.withdraw = action(WithdrawFactory.withdraw, true);
    A.stop = () => { A.stopped = true; };
    A.start = () => nextLot("Auction begins");

    A.view = () => teams.map(t => {
      const lot = A.lot, open = !!lot && lot.status === "open", purse = purses[t.id];
      const mine = open ? lot.bids.filter(b => b.teamId === t.id).length : 0, out = open ? lot.out[t.id] : null;
      const lead = open && BidFactory.leader(lot) && BidFactory.leader(lot).teamId === t.id;
      return { team: t, purse, lead, status: !open ? "" : out || (lead ? "Highest bidder" : mine ? "Outbid" : "Deciding"),
        canBid: open && !out && !lead && PurseFactory.canAfford(purse, BidFactory.nextAmount(lot)),
        canSkip: open && !out && !mine, canWithdraw: open && !out && mine > 0 };
    });
    return A;
  }
  return { create };
})();

const mk = html => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

const Net = { ws: null, id: null, code: null, host: false, h: {},
  connect() { return new Promise((ok, no) => {
    let ws; try { ws = Net.ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host); } catch (e) { return no(); }
    ws.onopen = () => ok(); ws.onerror = () => no();
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } if (Net.h[m.t]) Net.h[m.t](m); };
    ws.onclose = () => Net.h.closed && Net.h.closed();
  }); },
  send: m => { if (Net.ws && Net.ws.readyState === 1) Net.ws.send(JSON.stringify(m)); } };

const modelOf = A => {
  const lot = A.lot && A.lot.status === "open" ? A.lot : null, ld = lot && BidFactory.leader(lot);
  return { teams: A.teams, purses: A.purses, done: A.done, total: A.total,

    left: A.deadline ? Math.max(0, Math.round((A.deadline - Date.now()) / 1000)) : 0,
    lot: lot && { player: lot.player, next: BidFactory.nextAmount(lot), lead: ld ? ld.teamId : null, cur: ld ? ld.amount : 0, bidding: lot.bids.length > 0 },
    last: A.results.length ? (r => ({ name: r.player.name, status: r.status, teamId: r.teamId, price: r.price }))(A.results[A.results.length - 1]) : null,

const GameView = (() => {
  let refresh = () => {};
  const fmt = n => PurseFactory.format(n);
  const TIER_ORDER = ["diamond", "emerald", "gold", "silver", "bronze"];
  function standingsHtml(M, st) {
    const rows = RankFactory.rank(M.teams).map(r => {
      const t = r.team, p = M.purses[t.id], ps = t.slots.filter(x => x.player).map(x => x.player), cnt = {};
      ps.forEach(pl => { cnt[pl.tier] = (cnt[pl.tier] || 0) + 1; });

    });
    const key = { score: r => r.total, purse: r => r.p.remaining, dia: r => r.dia, spent: r => r.p.spent }[st.sort];
    const val = { score: r => r.total, purse: r => fmt(r.p.remaining), dia: r => r.dia, spent: r => fmt(r.p.spent) }[st.sort];
    rows.sort((a, b) => key(b) - key(a) || b.total - a.total);

  }
  function build(M0, o) {
    const e = mk(`<div style="padding-bottom:110px"><div class="room"><h2>Auction</h2><span class="toprow"><button class="btn" id="tv">Standings</button> ${o.stop ? '<button class="btn" id="stop">Stop</button>' : ""}</span></div>

      <div class="bidbox" id="bb"></div>
      <div id="mine"></div>
      <div class="oprows" id="ops"></div></div>`);
    const st = { sort: "score", open: new Set(), prev: {}, cur: {}, lastDone: M0.done };
    let lastM = M0;
    const draw = M => {
      lastM = M;
      const ranksNow = Object.fromEntries(RankFactory.rank(M.teams).map(r => [r.team.id, r.rank]));
      if (M.done !== st.lastDone) { st.prev = st.cur; st.lastDone = M.done; }
      st.cur = ranksNow;
      const l = M.lot, lt = id => M.teams.find(t => t.id === id), nm = id => esc(lt(id).name);
      e.querySelector("#bb").innerHTML = l
        ? `<div class="bb-who">${esc(l.player.name)}</div>
           ${l.lead ? `<div class="bb-lbl">Highest bid</div><div class="bb-amt">${fmt(l.cur)}</div><div class="bb-by" style="color:${lt(l.lead).color}">${nm(l.lead)}</div>`
             : `<div class="bb-lbl">No bids yet</div><div class="bb-amt">${fmt(l.next)}</div><div class="bb-by dim">Starting price</div>`}
           <div class="bb-next">${l.lead ? "Next bid " + fmt(l.next) : ""}</div>`
        : `<div class="bb-lbl">Next player coming</div>`;
      e.querySelector("#standings").innerHTML = standingsHtml(M, st);
      const rows = M.view.map(v => ({ v, t: M.teams.find(x => x.id === v.id), p: M.purses[v.id], mine: o.canControl(M.teams.find(x => x.id === v.id)) }));
      const mine = rows.filter(r => r.mine), ops = rows.filter(r => !r.mine);
      e.querySelector("#mine").innerHTML = mine.map(({ v, t, p }) => {
        const d = f => f ? "" : "disabled";
        return `<div class="mybox p-${PurseFactory.status(p, M.minP)}${v.lead ? " lead" : ""}" style="--tc:${t.color}">
          <div class="tn">${esc(t.name)}<span>Your team · ${v.status || (l ? "Ready" : "Waiting")}</span></div>
          <div class="pu">${fmt(p.remaining)}<small>${TeamFactory.filledCount(t)}/${t.slots.length} players filled</small></div>
          <div class="mystatus">${TeamFactory.isFull(t) ? "Your slots are full" : (v.status === "Not enough money" ? "Not enough money" : "")}</div>
          <div class="tb"><button data-a="bid" data-id="${t.id}" ${d(v.canBid)}>Bid ${l ? fmt(l.next) : ""}</button>
          <button data-a="skip" data-id="${t.id}" ${d(v.canSkip)}>Skip</button>
          <button data-a="withdraw" data-id="${t.id}" ${d(v.canWithdraw)}>Withdraw</button></div></div>`;
      }).join("") || (Net.code ? "" : `<div class="hint">You're spectating - no team of yours in this auction.</div>`);
      e.querySelector("#ops").innerHTML = ops.map(({ v, t, p }) => `<div class="oprow${v.lead ? " lead" : ""}" style="--tc:${t.color}">
        <b style="color:${t.color}">${esc(t.name)}</b>
        <em>${TeamFactory.filledCount(t)}/${t.slots.length} · ${fmt(p.remaining)} left${v.status ? " · " + v.status : ""}</em></div>`).join("");
    };
    refresh = M => { if (e.isConnected) draw(M); };
    e.querySelector("#mine").onclick = ev => { const b = ev.target.closest("button[data-a]"); if (b && !b.disabled) o.act(b.dataset.a, +b.dataset.id); };
    e.querySelector("#standings").onclick = ev => {
      const sb = ev.target.closest("button[data-sort]"), row = ev.target.closest(".srow");
      if (sb) st.sort = sb.dataset.sort;
      else if (row) { const id = +row.dataset.t; st.open.has(id) ? st.open.delete(id) : st.open.add(id); }

    if (o.stop) e.querySelector("#stop").onclick = o.stop;
    draw(M0);
    return e;
  }
  return { build, refresh: M => refresh(M), standingsHtml };
})();

const AssignView = (() => {
  const TOTAL = 60000, R = 34, C = 2 * Math.PI * R;
  const sc = v => v >= 70 ? "hi" : v >= 40 ? "mid" : "lo";
  function build(myChars, attrIds, deadline, onSubmit, opts = {}) {
    const state = {}; let selected = null, preview = null, submitted = false, drag = null;
    const stones = (opts.stones || []).slice(), stoneOn = {}, rollOf = {}; let selStone = null;   // Mega Stones: stoneOn maps attribute -> stone applied there

      ${stones.length ? `<div class="ax-lbl">Mega Stones <small>drag onto a placed character. This locks that slot.</small></div><div class="ax-tray" id="axstones"></div>` : ""}
      <button class="btn primary ax-lock" id="lock">Lock in</button></div>`);
    const byId = id => myChars.find(c => c.id === id);
    const attrOf = id => Object.keys(state).find(k => state[k] === id) || null;
    const bar = v => `<i class="ax-bar ${sc(v)}"><u style="width:${Math.min(100, v)}%"></u></i>`;
    function draw() {
      e.querySelector("#axtray").innerHTML = myChars.map(c => {
        const placed = attrOf(c.id) != null;
        return `<div class="ax-chip T-${c.tier}${placed ? " placed" : ""}${selected === c.id ? " sel" : ""}${drag && drag.moved && drag.id === c.id ? " lift" : ""}" data-cid="${c.id}">

      }).join("");
      const sT = e.querySelector("#axstones");
      if (sT) sT.innerHTML = stones.map(st => { const used = stoneUsed(st.id);
        return `<div class="ax-chip stone-chip${used ? " placed" : ""}${selStone === st.id ? " sel" : ""}${drag && drag.moved && drag.sid === st.id ? " lift" : ""}" style="--t:${st.color}" data-sid="${st.id}"><b>${st.icon} ${esc(st.name.replace(" Stone", ""))}</b><small>3 up · 3 down</small><span>${used ? "Applied" : "Drag onto a character"}</span></div>`; }).join("");
      e.querySelector("#axslots").innerHTML = attrIds.map(id => {
        const cid = state[id], c = cid != null ? byId(cid) : null;
        return `<div class="ax-slot${c ? " filled T-" + c.tier : ""}${preview != null ? " ready" : ""}${stoneOn[id] ? " stoned" : ""}${selStone && c && !stoneOn[id] ? " sready" : ""}" data-attr="${id}">
          <div class="ax-an">${esc(AttributeFactory.label(id))}${stoneOn[id] ? (ef => `<em class="ax-stone ${ef ? ef.dir : "none"}" style="--t:${stoneOn[id].color}">${stoneOn[id].icon} ${ef ? (ef.dir === "up" ? "▲+" : "▼−") + ef.delta : "no effect"}</em>`)(StoneFactory.effectOn(rollOf[id], id)) : ""}</div>
          ${c ? `<div class="ax-row"><span class="ax-cn">${esc(c.name)}</span></div><div class="ax-src">${esc(c.source || "")}</div>` : `<div class="ax-row"><span class="ax-cn dim">Empty</span></div>`}</div>`;
      }).join("");
      const placed = Object.keys(state).length;
      e.querySelector("#axsub").textContent = submitted ? "Locked in. Waiting for the reveal." : `${placed} of ${need} placed`;
      const lock = e.querySelector("#lock");
      lock.disabled = submitted || placed < need;
      lock.classList.toggle("go", !submitted && placed >= need);
      lock.textContent = submitted ? "Locked in ✓" : placed >= need ? "Lock in" : `Place ${need - placed} more`;
    }
    /* step 7: reveal animation. Shows ONLY the attribute of the slot the stone was dropped on. */
    function revealStone(st, c, r, slotAttr, done) {
      const eff = StoneFactory.effectOn(r, slotAttr), label = AttributeFactory.label(slotAttr);
      const row1 = (x, dir) => `<div class="sr-row ${dir}${x.id === slotAttr ? " hit" : ""}"><span>${dir === "up" ? "▲" : "▼"} ${esc(x.label)}${x.id === slotAttr ? " · this slot" : ""}</span><b>${dir === "up" ? "+" : "−"}${x.delta}</b></div>`;
      const verdict = eff ? `${esc(label)} ${eff.dir === "up" ? "was upgraded" : "was downgraded"} (${eff.dir === "up" ? "+" : "−"}${eff.delta})` : `${esc(label)} is not affected. Your slot stays the same.`;
      const o = document.createElement("div"); o.className = "stone-reveal"; o.style.setProperty("--t", st.color);
      o.innerHTML = `<div class="sr-box"><div class="sr-gem">${st.icon}</div><h3>${esc(st.name)}</h3><p>applied to <b>${esc(c ? c.name : "")}</b></p>
        <div class="sr-list">${r.ups.map(x => row1(x, "up")).join("")}${r.downs.map(x => row1(x, "dn")).join("")}</div>
        <div class="sr-verdict ${eff ? eff.dir : "none"}">${verdict}</div>
        <button class="btn primary sr-btn">Skip</button></div>`;
      document.body.appendChild(o);
      const rows = [...o.querySelectorAll(".sr-row")], vd = o.querySelector(".sr-verdict"), btn = o.querySelector(".sr-btn"), timers = [];
      let closed = false, shown = false;
      const close = () => { if (closed) return; closed = true; timers.forEach(clearTimeout); o.classList.add("out"); setTimeout(() => o.remove(), 250); if (done) done(); };
      const finish = () => { shown = true; rows.forEach(x => x.classList.add("show")); vd.classList.add("show"); btn.textContent = "Continue"; };
      rows.forEach((x, i) => timers.push(setTimeout(() => x.classList.add("show"), 700 + i * 450)));
      timers.push(setTimeout(() => { finish(); timers.push(setTimeout(close, 5000)); }, 700 + rows.length * 450 + 200));
      btn.onclick = () => { if (!shown) { timers.forEach(clearTimeout); timers.length = 0; finish(); timers.push(setTimeout(close, 5000)); } else close(); };
    }
    const stoneUsed = sid => Object.values(stoneOn).some(x => x.id === sid);

const Online = (() => {
  const L = { room: "", players: [], started: false, max: 4 };
  let A = null, inGame = false, guestCard = null, guestLot = null, refreshLobby = () => {}, lastM = null;
  let assignAttrs = [], assignDeadline = 0, assignPicks = {}, assignStones = {}, assignTimer = null, assignDone = false;
  const lobbyBc = () => { Net.send({ t: "lobby", L }); refreshLobby(); };
  const gone = new Set();   // players who left mid-game; dropped when the host returns to the lobby
  // Back to the lobby of the same room (no new room, no retyping). Host: resets the room for everyone. Guest: waits in the lobby.
  function toLobby() {
    clearTimeout(assignTimer); SliderCardFactory.hide();
    A = null; inGame = false; guestCard = guestLot = null; lastM = null; assignDone = false;
    if (Net.host) { L.players = L.players.filter(p => !gone.has(p.id)); gone.clear(); L.started = false; lobbyBc(); }
    Screens.show("lobby");
  }

  function leave() {
    Net.h = {}; if (Net.ws) Net.ws.close(); clearTimeout(assignTimer);
    Net.ws = null; Net.code = null; Net.id = null; A = null; inGame = false; guestCard = guestLot = null; lastM = null;
    Screens.show("main");
  }
  function hostAct(kind, from, payload) {
    if (kind === "assign") return receiveAssign(from, payload);
    const team = A && A.teams.find(t => t.owner === from);
    if (!team || !["bid", "skip", "withdraw"].includes(kind)) return;
    const r = A[kind](team.id);
    if (r && r.reason) { if (from === Net.id) toast(r.reason); else Net.send({ t: "toast", to: from, msg: r.reason }); }
  }
  function receiveAssign(from, payload) {
    const team = A && A.teams.find(t => t.owner === from); if (!team || assignDone) return;
    const v2 = payload && payload.picks && payload.stones !== undefined, picks = (v2 ? payload.picks : payload) || {};
    assignPicks[team.id] = picks;
    assignStones[team.id] = StoneFactory.validate(team, picks, v2 ? payload.stones : {});   // host checks ownership, one use per stone
    if (Object.keys(assignPicks).length >= A.teams.length) finalizeAssign();
  }
  function finalizeAssign() {
    if (assignDone) return; assignDone = true; clearTimeout(assignTimer);
    A.teams.forEach(t => { if (!assignPicks[t.id]) assignPicks[t.id] = {}; if (!assignStones[t.id]) assignStones[t.id] = {}; });
    const M = { teams: A.teams, purses: A.purses, results: A.results, finished: A.finished, assign: { attrs: assignAttrs, picks: assignPicks, stones: assignStones } };
    Net.send({ t: "end", M }); inGame = false; Screens.show("results", M);
  }
  function finish() {
    const cfg = RoomSettings.current;
    assignAttrs = AttributeFactory.pick(cfg.slots || 6); assignDeadline = Date.now() + 60000; assignPicks = {}; assignStones = {}; assignDone = false;
    Net.send({ t: "assign-start", attrs: assignAttrs, deadline: assignDeadline });
    clearTimeout(assignTimer); assignTimer = setTimeout(finalizeAssign, 60300);
    const team = A.teams.find(t => t.owner === Net.id);
    Screens.show("assign", { attrs: assignAttrs, deadline: assignDeadline, team });
  }
  function assign(data) {
    const myChars = data.team ? data.team.slots.filter(s => s.player).map(s => s.player) : [];
    return AssignView.build(myChars, data.attrs, data.deadline, (picks, sm) => {
      const stones = Object.fromEntries(Object.entries(sm || {}).map(([a, v]) => [a, v.id])), payload = { picks, stones };
      if (Net.host) receiveAssign(Net.id, payload); else Net.send({ t: "act", kind: "assign", payload });
    }, { stones: data.team ? StoneFactory.ownedOf(data.team) : [] });
  }
  function start() {
    const cfg = RoomSettings.current, pal = TeamFactory.config.palette;
    L.started = true; lobbyBc();
    const names = shuffle(LocalTestMode.NAMES.slice()), used = new Set(L.players.map(p => p.color).filter(Boolean));
    const teams = L.players.map(p => {
      const c = p.color || shuffle(pal.filter(x => !used.has(x)))[0] || pal[0]; used.add(c);
      return TeamFactory.create({ name: p.teamName.trim() || names.pop() || "Team " + p.id, color: c, owner: p.id, slotCount: cfg.slots });
    });
    PlayerFactory.reroll();
    A = AuctionFactory.create({ teams, purses: PurseFactory.createMany(teams, cfg.purse), pool: PlayerFactory.getAll(),
      cardSeconds: cfg.timer > 0 ? cfg.timer : 15,
      hooks: { onUpdate: () => { const M = modelOf(A); Net.send({ t: "snap", M }); GameView.refresh(M); },
        onWarn: (t, w) => { const msg = t.name + ": " + w.message; toast(msg); Net.send({ t: "toast", msg }); },
        onTransition: o => Net.send({ t: "tr", o }), onFinish: finish } });
    inGame = true; Net.send({ t: "snap", M: modelOf(A) }); Screens.show("game", modelOf(A));
    setTimeout(A.start, 0);
  }
  function syncCard(M) {
    const l = M.lot;
    if (!l) { SliderCardFactory.hide(); guestCard = guestLot = null; return; }
    const label = l.bidding ? "Bidding" : "On the block";
    if (guestLot !== l.player.id) { guestLot = l.player.id; guestCard = SliderCardFactory.showPlayer(l.player, M.left, { label }); }
    else if (guestCard) guestCard.reset(M.left, label);
  }
  async function open(mode, o) {
    try { await Net.connect(); } catch { toast("Online rooms need the game server. Use the one-screen mode."); return; }
    const cfg = RoomSettings.current;
    Net.host = mode === "create"; inGame = false; L.started = false; L.players = [];
    Net.h = {
      created: m => { Net.id = m.id; Net.code = m.code; Object.assign(L, { room: cfg.name, max: cfg.players });
        L.players = [{ id: m.id, name: o.name, teamName: o.teamName || "", color: o.color || "" }]; Screens.show("lobby"); },
      joined: m => { Net.id = m.id; Net.code = m.code; Screens.show("lobby"); },
      err: m => toast(m.msg),
      "peer-join": m => { if (L.started || L.players.length >= L.max) return Net.send({ t: "full", to: m.id });
        L.players.push({ id: m.id, name: m.name, teamName: m.teamName || "", color: m.color || "" }); lobbyBc();
        if (L.players.length >= L.max) start(); },
      "peer-left": m => { const p = L.players.find(x => x.id === m.id);
        if (L.started) { gone.add(m.id); if (p) toast(p.name + " left"); } else { L.players = L.players.filter(x => x.id !== m.id); lobbyBc(); } },
      act: m => hostAct(m.kind, m.from, m.payload),
      lobby: m => { Object.assign(L, m.L); refreshLobby(); if (!L.started && document.querySelector(".res-hero")) toast("The host is back in the lobby"); },
      full: () => { toast("Room is full or already started"); leave(); },
      snap: m => { lastM = m.M; if (!inGame) { inGame = true; Screens.show("game", m.M); } else GameView.refresh(m.M); syncCard(m.M); },
      tr: m => TransitionFactory.play(m.o),
      toast: m => toast(m.msg),
      "assign-start": m => { const team = lastM && lastM.teams.find(t => t.owner === Net.id);
        Screens.show("assign", { attrs: m.attrs, deadline: m.deadline, team }); },
      end: m => { inGame = false; Screens.show("results", m.M); },
      closed: () => { toast("Room closed"); leave(); }

  }
  function lobby() {
    const e = mk(`<div class="center"><div class="form wide"><h2 id="rn"></h2>
      <p class="hint">Room code: <b class="code" style="padding:2px 10px">${esc(Net.code)}</b></p>
      <p class="hint">Link: ${esc(location.origin)}/?join=${esc(Net.code)}</p>
      <div id="pl" style="margin:14px 0"></div>
      <p class="hint" id="wait"></p><button class="btn primary" id="go">Start auction</button><button class="link" id="lv">Leave</button></div></div>`);
    const go = e.querySelector("#go");
    refreshLobby = () => {
      if (!e.isConnected) return;
      e.querySelector("#rn").textContent = L.room || "Room";
      e.querySelector("#pl").innerHTML = L.players.map(p => `<div class="tvs"><i style="width:12px;height:12px;border-radius:50%;background:${p.color || "#444"};display:inline-block"></i>
        <b>${esc(p.teamName || p.name)}</b>${p.id === Net.id ? " (you)" : ""}</div>`).join("");
      go.hidden = !Net.host;
      const enough = L.players.length >= 2;
      if (Net.host) go.disabled = !enough;
      e.querySelector("#wait").textContent = Net.host
        ? (enough ? L.players.length + " of " + L.max + " players joined. Starts automatically once full, or start now."
                  : "Waiting for at least one more player to join with code " + esc(Net.code) + "…")
        : "Waiting for the host to start…";
    };
    go.onclick = start; e.querySelector("#lv").onclick = leave;
    setTimeout(refreshLobby, 0);
    return e;
  }
  function game(M) {
    return GameView.build(M, { act: (k, id) => { if (Net.host) hostAct(k, Net.id); else Net.send({ t: "act", kind: k }); },
      stop: Net.host ? () => { A.stop(); finish(); } : null, canControl: t => t.owner === Net.id });
  }
