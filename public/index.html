/* ================= LocalTestMode (one-screen play; default here since published pages have no game server) ================= */
const LocalTestMode = (() => {
  const on = false, SETUP_SECONDS = 50;   // one-screen test mode + AI teams are switched off: every team is a real player joining with the room code
  const NAMES = ["Royal Strikers", "Night Owls", "Thunder Kings", "Desert Hawks", "Silver Foxes", "Iron Wolves", "Blue Comets",
    "Red Dragons", "Golden Eagles", "Storm Riders", "Pink Panthers", "Green Mambas", "Sun Chasers", "Ice Breakers", "Wild Bulls", "Mighty Otters"];
  const el = html => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
  let session = null;

  function setup() {
    const r = RoomSettings.current, palette = TeamFactory.config.palette;
    const teams = TeamFactory.createMany(r.teams, r.slots), colorSet = teams.map(() => false);
    const rows = teams.map((t, i) => `<div class="trow"><input type="text" maxlength="20" placeholder="Team ${i + 1} name" data-i="${i}">
      <div class="sw">${palette.map(c => `<button class="swatch" data-i="${i}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div></div>`).join("");
    const e = el(`<div class="center"><div class="form wide"><h2>Name your teams</h2>
      <p class="hint">Time left: <b id="left">${SETUP_SECONDS}s</b>. Anything left empty is filled randomly.</p>
      ${teams.length > 1 ? `<label class="hint" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="ai" checked> Play vs AI: you are Team 1, the AI names, colours, bids and locks in for all other teams</label>` : ""}${rows}
      <button class="btn primary" id="go" disabled>Start auction</button><button class="link" id="back">Back</button></div></div>`);
    const aiBox = e.querySelector("#ai");
    const inputs = [...e.querySelectorAll("input[type=text]")], sw = [...e.querySelectorAll(".swatch")], go = e.querySelector("#go");
    const taken = (c, i) => teams.some((t, j) => j !== i && colorSet[j] && t.color === c);
    const paint = () => sw.forEach(b => { const i = +b.dataset.i; b.classList.toggle("on", colorSet[i] && teams[i].color === b.dataset.c);
      b.disabled = taken(b.dataset.c, i); b.style.opacity = b.disabled ? .2 : 1; });
    const useAI = () => !!(aiBox && aiBox.checked);
    const ready = () => { const need = useAI() ? 1 : inputs.length; go.disabled = !(inputs.slice(0, need).every(x => x.value.trim()) && colorSet.slice(0, need).every(Boolean)); };
    const rowEls = [...e.querySelectorAll(".trow")];
    const syncAI = () => { rowEls.forEach((r, i) => { r.style.display = i > 0 && useAI() ? "none" : ""; }); ready(); };
    if (aiBox) { aiBox.onchange = syncAI; syncAI(); }
    inputs.forEach(x => x.oninput = ready);
    sw.forEach(b => b.onclick = () => { const i = +b.dataset.i; if (taken(b.dataset.c, i)) return; teams[i].color = b.dataset.c; colorSet[i] = true; paint(); ready(); });
    e.querySelector("#back").onclick = () => { clearInterval(timer); Screens.show("create"); };
    let left = SETUP_SECONDS;
    const timer = setInterval(() => {
      if (!e.isConnected) return clearInterval(timer);
      e.querySelector("#left").textContent = Math.max(--left, 0) + "s";
      if (left > 0) return;
      clearInterval(timer);
      const used = new Set(inputs.map(x => x.value.trim().toLowerCase()).filter(Boolean));
      const names = shuffle(NAMES.filter(n => !used.has(n.toLowerCase())));
      inputs.forEach(x => { if (!x.value.trim()) x.value = names.pop() || "Team " + (+x.dataset.i + 1); });
      teams.forEach((t, i) => { if (!colorSet[i]) { const free = palette.filter(c => !taken(c, i)); t.color = free[Math.floor(Math.random() * free.length)] || palette[0]; colorSet[i] = true; } });
      paint(); ready(); toast("Time up: empty teams were filled randomly");
    }, 1000);
    go.onclick = () => {
      clearInterval(timer);
      // AI teams (or anything left empty) get a random name and colour
      const usedN = new Set(inputs.map(x => x.value.trim().toLowerCase()).filter(Boolean)), pool = shuffle(NAMES.filter(n => !usedN.has(n.toLowerCase())));
      inputs.forEach((x, i) => { if (!x.value.trim()) x.value = pool.pop() || "Team " + (i + 1); });
      teams.forEach((t, i) => { if (!colorSet[i]) { const free = palette.filter(c => !taken(c, i)); t.color = free[Math.floor(Math.random() * free.length)] || palette[0]; colorSet[i] = true; } });
      AI.ids = new Set(useAI() ? teams.slice(1).map(t => t.id) : []);
      teams.forEach((t, i) => { TeamFactory.setName(t, inputs[i].value); TeamFactory.setColor(t, t.color); });
      session = { teams, purses: PurseFactory.createMany(teams, r.purse) };
      Screens.show("auction");
    };
    paint();
    return e;
  }

  // One-screen mode has no private assign step, so each team's best characters are placed automatically
  // on the drawn attributes (highest score first), then the normal reveal screen scores them.
  function autoAssign(A) {
    const attrs = AttributeFactory.pick((RoomSettings.current || {}).slots || 6), picks = {};
    A.teams.forEach(t => {
      const chars = t.slots.filter(s => s.player).map(s => s.player), left = new Set(chars.map(c => c.id));
      picks[t.id] = {};
      attrs.forEach(a => {
        let best = null;
        chars.forEach(c => { if (left.has(c.id) && (!best || AttributeFactory.score(c, a) > AttributeFactory.score(best, a))) best = c; });
        if (best) { picks[t.id][a] = best.id; left.delete(best.id); }
      });
    });
    return { teams: A.teams, purses: A.purses, results: A.results, finished: A.finished, assign: { attrs, picks, stones: {} } };
  }

  // ---- Temporary offline AI: teams other than Team 1 bid/skip on their own and place their line-up automatically ----
  const AI = {
    ids: new Set(), timer: null,
    stop() { clearInterval(AI.timer); AI.timer = null; },
    // How much each tier is worth to the AI (relative to an even share of its purse).
    TIER_W: { diamond: 2.4, emerald: 1.8, gold: 1.2, silver: 0.8, bronze: 0.5 },
    greed: {},
    // Each AI team decides a private maximum for every character: tier value x its purse per open slot x its own greed,
    // trimmed for tiers it already owns, and capped so it can still afford to fill its remaining slots.
    maxFor(A, t, p) {
      if (StoneFactory.isStone(p)) {   // simple for now, tuned in a later step
        const rem = A.purses[t.id].remaining;
        if (AI.greed[t.id] == null) AI.greed[t.id] = 0.8 + Math.random() * 0.45;
        return Math.random() < 0.35 ? 0 : Math.min(rem * 0.25, 1.2 * AI.greed[t.id] * (0.6 + Math.random() * 0.8));
      }
      const purse = A.purses[t.id], empty = Math.max(1, t.slots.length - TeamFactory.filledCount(t));
      if (AI.greed[t.id] == null) AI.greed[t.id] = 0.8 + Math.random() * 0.45;
      const have = t.slots.filter(x => x.player && x.player.tier === p.tier).length;
      const cap = purse.remaining - (empty - 1) * 0.5, per = purse.remaining / empty;
      let worth = per * AI.TIER_W[p.tier] * AI.greed[t.id] * Math.pow(0.85, have) * (0.85 + Math.random() * 0.3);
      // Cheap characters are often not worth the trouble while there are still many slots to fill
      if ((p.tier === "bronze" || p.tier === "silver") && empty > 1 && Math.random() < 0.25) worth = 0;
      return Math.min(cap, worth);
    },
    start(A) {
      AI.stop(); AI.greed = {}; const seen = new WeakMap();
      AI.timer = setInterval(() => {
        const lot = A.lot;
        if (A.finished || A.stopped) return AI.stop();
        if (!lot || lot.status !== "open") return;
        let maxes = seen.get(lot); if (!maxes) { maxes = {}; seen.set(lot, maxes); }
        for (const v of A.view()) {
          const t = v.team; if (!AI.ids.has(t.id) || A.lot !== lot || lot.status !== "open") continue;
          if (Math.random() > 0.4) continue;                       // think for a moment
          if (maxes[t.id] == null) maxes[t.id] = AI.maxFor(A, t, lot.player);
          const next = BidFactory.nextAmount(lot);
          if (next <= maxes[t.id] + 1e-9) { if (v.canBid && Math.random() < 0.85) A.bid(t.id); }
          else if (v.canWithdraw) A.withdraw(t.id);                // outbid and the price is now above its value
          else if (v.canSkip) A.skip(t.id);                        // not worth it from the start
        }
      }, 800);
    },
    // Fill every attribute with the character who scores highest on it (each character used once).
    /* the AI drops each Mega Stone it owns on a random placed character (one stone per slot) */
    applyStones(t, picks) {
      const free = shuffle(Object.keys(picks || {}).filter(a => picks[a] != null)), out = {};
      StoneFactory.ownedOf(t).forEach(st => { const a = free.pop(); if (a) out[a] = st.id; });
      return out;
    },
    place(t, attrs) {
      const chars = t.slots.filter(x => x.player).map(x => x.player), left = new Set(chars.map(c => c.id)), out = {};
      shuffle(attrs.slice()).forEach(a => {
        let best = null;
        chars.forEach(c => { if (left.has(c.id) && (!best || AttributeFactory.score(c, a) > AttributeFactory.score(best, a))) best = c; });
        if (best) { out[a] = best.id; left.delete(best.id); }
      });
      return out;
    }
  };

  // Offline (one-screen) line-up round: attributes are drawn at random, then each team takes a turn on the same screen
  // (pass the device), places its characters by hand within 60 seconds, and locks in. Results then score the real picks.
  function assignRound(A) {
    const attrs = AttributeFactory.pick((RoomSettings.current || {}).slots || 6);
    Screens.show("lassign", { A, attrs, idx: 0, picks: {}, stones: {} });
  }
  function lassign(d) {
    const { A, attrs, idx, picks } = d, stones = d.stones || (d.stones = {}), team = A.teams[idx];
    const chars = team.slots.filter(x => x.player).map(x => x.player);
    const next = () => {
      if (idx + 1 < A.teams.length) Screens.show("lassign", { A, attrs, idx: idx + 1, picks, stones });
      else Screens.show("results", { teams: A.teams, purses: A.purses, results: A.results, finished: A.finished, assign: { attrs, picks, stones } });
    };
    if (AI.ids.has(team.id)) { picks[team.id] = AI.place(team, attrs); stones[team.id] = StoneFactory.validate(team, picks[team.id], AI.applyStones(team, picks[team.id])); const box = el(`<div class="center"><div class="form wide handoff"><div class="av" style="background:${team.color}">${esc(team.name.slice(0, 1))}</div><h2 style="color:${team.color}">${esc(team.name)}</h2><p class="hint">AI is choosing its line-up…</p><div class="aispin"></div></div></div>`); setTimeout(next, 1200); return box; }
    const wrap = el(`<div class="center"><div class="form wide handoff"><div class="av" style="background:${team.color}">${esc(team.name.slice(0, 1))}</div><h2 style="color:${team.color}">${esc(team.name)}</h2>
      <p class="hint">Team ${idx + 1} of ${A.teams.length}. ${attrs.length} random attributes were drawn, you get 60 seconds.<br>Make sure only this team is looking.</p>
      <button class="btn primary" id="rdy">Show my line-up</button></div></div>`);
    wrap.querySelector("#rdy").onclick = () => {
      if (!chars.length) { picks[team.id] = {}; return next(); }
      wrap.innerHTML = "";
      wrap.appendChild(AssignView.build(chars, attrs, Date.now() + 60000, (p, sm) => { picks[team.id] = p; stones[team.id] = StoneFactory.validate(team, p, sm); setTimeout(next, 400); }, { stones: StoneFactory.ownedOf(team) }));
    };
    return wrap;
  }

  /* ===== TEST-ONLY: skip the auction, give every team random characters, jump to the line-up screen. Remove this block + the one line in auction() ===== */
  function testSkipButton(A) {
    const b = document.createElement("button");
    b.textContent = "Skip to line-up (test)";
    b.style.cssText = "position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:150;font-size:.68rem;padding:4px 10px;border-radius:99px;border:1px dashed var(--mute);background:#0d1a14cc;color:var(--mute)";
    b.onclick = () => {
      A.stopped = true; AI.stop(); SliderCardFactory.hide();
      const pool = shuffle(PlayerFactory.getAll()), used = new Set();
      A.teams.forEach(t => t.slots.forEach(sl => { if (sl.player) used.add(sl.player.id); }));
      A.teams.forEach(t => { while (!TeamFactory.isFull(t) && pool.length) { const pl = pool.pop(); if (used.has(pl.id)) continue; used.add(pl.id); TeamFactory.addPlayer(t, pl); } });
      A.teams.forEach(t => { if (!StoneFactory.ownedOf(t).length) (t.stones = t.stones || []).push(StoneFactory.createLot(StoneFactory.randomId())); });   // one Mega Stone Card per team, for testing
      A.finished = true; assignRound(A);
    };
    return b;
  }

  function auction() {
    const r = RoomSettings.current, { teams, purses } = session;
    PlayerFactory.reroll();
    const A = AuctionFactory.create({ teams, purses, pool: PlayerFactory.getAll(), cardSeconds: r.timer > 0 ? r.timer : 15,
      hooks: { onUpdate: () => GameView.refresh(modelOf(A)), onWarn: (t, w) => toast(t.name + ": " + w.message), onFinish: () => assignRound(A) } });
    session.A = A;
    const e = GameView.build(modelOf(A), { act: (k, id) => { const x = A[k](id); if (x && x.reason) toast(x.reason); },
      stop: () => { A.stop(); assignRound(A); }, canControl: t => !AI.ids.has(t.id) });
    AI.start(A);
    setTimeout(A.start, 0);
    /* TEST-ONLY skip button: delete this line and the testSkip function to remove it */
    /* (test skip button disabled for the public version) */
    return e;
  }

  function confetti(color) {
    const wrap = document.createElement("div"); wrap.className = "confetti-wrap";
    const colors = [color, "#e6b447", "#7fdcff", "#8ad06a", "#f28cb8"];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("div"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "%"; c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 1.6) + "s"; c.style.animationDelay = (Math.random() * .6) + "s";
      wrap.appendChild(c);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 4500);
  }

  function results(M) {
    M = M || session.A;
    const unsold = M.results.filter(x => x.status !== "sold");
    const rank = RankFactory.rank(M.teams);
    const myTeam = Net.id ? M.teams.find(t => t.owner === Net.id) : null;
    const status = M.finished ? "Auction complete" : "Auction stopped";
    const stoneOnChar = {};   // character id -> where a Mega Stone was used on it
    let board = null, stoneHtml = "", winnerTeam = rank[0].team, winnerPts = rank[0].total, myPts = null;
    if (M.assign && M.assign.attrs && M.assign.attrs.length) {
      const attrs = M.assign.attrs, picks = M.assign.picks || {}, totals = {}, rollsBy = {};
      M.teams.forEach(t => { rollsBy[t.id] = StoneFactory.rolls(t, picks[t.id] || {}, (M.assign.stones || {})[t.id] || {}); });
      const findPlayer = id => { for (const t of M.teams) for (const s of t.slots) if (s.player && s.player.id === id) return s.player; return null; };
      M.teams.forEach(t => totals[t.id] = 0);
      board = attrs.map(attrId => {
        const row = M.teams.map(t => {
          const pid = (picks[t.id] || {})[attrId], p = pid != null ? findPlayer(pid) : null;
          const rl = rollsBy[t.id][attrId], eff = p ? StoneFactory.effectOn(rl, attrId) : null;   // Mega Stone on this slot
          const s = p ? (eff ? eff.to : AttributeFactory.score(p, attrId)) : 0;
          totals[t.id] += s;
          return { team: t, player: p, score: s, eff, stone: rl ? StoneFactory.get(rl.type) : null };
        });
        return { attrId, row, best: Math.max(...row.map(x => x.score)) };
      });
      M.teams.forEach(t => Object.entries(rollsBy[t.id] || {}).forEach(([sa, rl]) => { const ch = findPlayer((picks[t.id] || {})[sa]); if (ch) stoneOnChar[ch.id] = { label: AttributeFactory.label(sa), eff: StoneFactory.effectOn(rl, sa), icon: (StoneFactory.get(rl.type) || {}).icon || "💎" }; }));
      const mineFirst = myTeam ? [myTeam, ...M.teams.filter(t => t.id !== myTeam.id)] : M.teams.slice();
      const blocks = mineFirst.map(t => Object.entries(rollsBy[t.id] || {}).map(([slotAttr, rl]) => {
        const ch = findPlayer((picks[t.id] || {})[slotAttr]), sd = StoneFactory.get(rl.type), ef = StoneFactory.effectOn(rl, slotAttr);
        const chip = (x, dir) => `<i class="${dir}${x.id === slotAttr ? " hit" : ""}">${dir === "up" ? "▲" : "▼"} ${esc(x.label)} ${dir === "up" ? "+" : "−"}${x.delta}</i>`;
        return `<div class="sfx-team" style="--tc:${t.color}"><div class="sfx-h"><b>${esc(t.name)}${myTeam && t.id === myTeam.id ? " (you)" : ""}</b><span>${sd ? sd.icon : ""} on ${esc(ch ? ch.name : "?")} · ${esc(AttributeFactory.label(slotAttr))} slot</span></div>
          <div class="ax-roll">${rl.ups.map(x => chip(x, "up")).join("")}${rl.downs.map(x => chip(x, "dn")).join("")}</div>
          <div class="sfx-v ${ef ? ef.dir : "none"}">${ef ? esc(AttributeFactory.label(slotAttr)) + (ef.dir === "up" ? " upgraded +" : " downgraded −") + ef.delta : esc(AttributeFactory.label(slotAttr)) + " was not affected"}</div></div>`; }).join("")).join("");
      const unused = mineFirst.filter(t => StoneFactory.ownedOf(t).length > Object.keys(rollsBy[t.id] || {}).length).map(t => `<div class="sfx-team" style="--tc:${t.color}"><div class="sfx-h"><b>${esc(t.name)}${myTeam && t.id === myTeam.id ? " (you)" : ""}</b><span>💎 Mega Stone not used</span></div></div>`).join("");
      if (blocks || unused) stoneHtml = `<div class="tvt" style="--tc:#ff5ad1"><div class="tvh"><b>💎 Mega Stone changes</b><span>Every team, every attribute: up, down or unaffected</span></div>${blocks}${unused}</div>`;
      winnerTeam = M.teams.reduce((a, b) => totals[b.id] > totals[a.id] ? b : a);
      winnerPts = totals[winnerTeam.id];
      myPts = myTeam ? totals[myTeam.id] : null;
    } else if (myTeam) myPts = rank.find(r => r.team.id === myTeam.id).total;
    const iWon = !!(myTeam && winnerTeam.id === myTeam.id);
    const heroHtml = myTeam
      ? `<div class="res-hero${iWon ? "" : " lose"}"><small>${status}</small>
          <h1>${iWon ? "🏆 You won!" : "So close — you lost"}</h1>
          <div class="res-score" style="color:${myTeam.color}">${esc(myTeam.name)} · ${myPts} pts</div>
          <p class="res-why">${iWon ? "Your line-up scored highest overall." : `${esc(winnerTeam.name)} won with ${winnerPts} pts.`}</p></div>`
      : `<div class="res-hero"><small>${status}</small><h1>🏆 ${esc(winnerTeam.name)} wins</h1>
          <div class="res-score" style="color:${winnerTeam.color}">${winnerPts} pts</div></div>`;
    const boardHtml = board ? `<div class="tvt" style="--tc:var(--gold)"><div class="tvh"><b>Reveal</b><span>Real attribute scores from the dataset</span></div>
      ${board.map(r => `<div class="brow"><b>${esc(AttributeFactory.label(r.attrId))}</b><div class="bcells">
        ${r.row.map(x => `<span class="bcell${x.score === r.best && x.score > 0 ? " win" : ""}" style="--tc:${x.team.color}">${x.player ? esc(x.player.name) : "—"}<em>${x.score}</em>${x.stone ? `<u class="bfx ${x.eff ? x.eff.dir : "none"}">${x.stone.icon}${x.eff ? (x.eff.dir === "up" ? " ▲+" : " ▼−") + x.eff.delta : " no change"}</u>` : ""}</span>`).join("")}
      </div></div>`).join("")}</div>` : "";
    const ordered = myTeam ? [rank.find(r => r.team.id === myTeam.id), ...rank.filter(r => r.team.id !== myTeam.id)] : rank;
    const GROUPS = [["Power", ["Strength", "Ability Power", "Range"]], ["Speed", ["Speed", "Reflexes", "Instinct"]], ["Defense", ["Durability", "Endurance", "Stamina", "Regeneration"]],
      ["Skill", ["Combat", "Weapon Mastery", "Precision"]], ["Mind", ["Battle IQ", "IQ", "Experience", "Adaptability"]], ["Aura", ["Hax Potential", "Willpower", "Intimidation"]]];
    const overallOf = p => Math.round(p.total != null ? p.total / 20 : p.rating * 20);
    const known = {}; M.teams.forEach(t => t.slots.forEach(sl => { if (sl.player) known[sl.player.id] = sl.player; })); unsold.forEach(x => { known[x.player.id] = x.player; });
    const radar = p => {
      const cx = 120, cy = 118, R = 72, pt = (i, k) => { const an = (-90 + i * 60) * Math.PI / 180; return [cx + Math.cos(an) * R * k, cy + Math.sin(an) * R * k]; };
      const vals = GROUPS.map(([, ks]) => Math.round(ks.reduce((n, k) => n + (+p.core[k] || 0), 0) / ks.length));
      const ring = k => GROUPS.map((_, i) => pt(i, k).join(",")).join(" ");
      const data = vals.map((v, i) => pt(i, Math.max(v, 4) / 100).join(",")).join(" ");
      const lab = GROUPS.map(([n], i) => { const [x, y] = pt(i, 1.36); return `<text x="${x}" y="${y - 2}" text-anchor="middle" class="rd-n">${n}</text><text x="${x}" y="${y + 11}" text-anchor="middle" class="rd-v">${vals[i]}</text>`; }).join("");
      return `<svg viewBox="0 0 240 236" class="radar">${[0.25, 0.5, 0.75, 1].map(k => `<polygon points="${ring(k)}" class="rd-g"/>`).join("")}${GROUPS.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}" class="rd-g"/>`).join("")}<polygon points="${data}" class="rd-d"/>${lab}</svg>`;
    };
    const detail = p => {
      const d = el(`<div class="sheet-bg"><div class="sheet T-${p.tier}"><button class="sheet-x" aria-label="Close">×</button>
        <div class="sh-name">${esc(p.name)}</div><div class="sh-sub">${esc(p.source || "")} · ${esc(p.tierLabel)} · ${overallOf(p)} overall</div>
        ${p.core ? radar(p) : ""}${p.ability && p.ability !== "—" ? `<div class="sh-abil">${esc(p.ability)}</div>` : ""}</div></div>`);
      d.onclick = ev => { if (ev.target === d || ev.target.closest(".sheet-x")) d.remove(); };
      document.body.appendChild(d);
    };
    const mini = p => { const sx = stoneOnChar[p.id];
      return `<div class="mc T-${p.tier}" data-pid="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.source || p.roleLabel || "")}</small><span>${esc(p.tierLabel)} · ${overallOf(p)}</span>${sx ? `<u class="bfx ${sx.eff ? sx.eff.dir : "none"}">${sx.icon} ${sx.eff ? (sx.eff.dir === "up" ? "▲ " : "▼ ") + esc(sx.label) + (sx.eff.dir === "up" ? " +" : " −") + sx.eff.delta : "– " + esc(sx.label) + " no change"}</u>` : ""}</div>`; };
    const teamCard = r => { const t = r.team, isMine = myTeam && t.id === myTeam.id, squad = t.slots.filter(s => s.player).map(s => s.player).sort((a, b) => (b.total || 0) - (a.total || 0));
      return `<div class="sq-card" style="--tc:${t.color}">
        <div class="sq-head"><i class="sq-rank">#${r.rank}</i><b>${esc(t.name)}${isMine ? " (you)" : ""}</b>
          <span><em>${r.stars}</em> overall</span><span><em>${r.diversity}</em> balance</span></div>
        <div class="mc-grid">${squad.map(mini).join("") || "<div class='hint'>No players</div>"}</div>${StoneFactory.ownedOf(t).length ? `<div class="res-stones"><small>Mega Stones</small>${StoneFactory.ownedHtml(t)}</div>` : ""}</div>`; };
    const online = !!Net.code, host = !!Net.host;
    const e = el(`<div class="res-page"><div class="room"><h2>Results</h2></div>
      ${heroHtml}${boardHtml}${stoneHtml}<div class="res-title">Squads <small>tap a character for details</small></div>${ordered.map(teamCard).join("")}
      <div class="res-title">Unsold <small>${unsold.length}</small></div>
      <div class="un-wrap">${unsold.map(x => `<span class="un T-${x.player.tier}" data-pid="${x.player.id}">${esc(x.player.name)}</span>`).join("") || "<div class='hint'>Nobody went unsold</div>"}</div>
      <div class="res-bar"><button class="btn primary" id="again">${online ? (host ? "Play again in this room" : "Back to lobby") : "Play again"}</button>
        <button class="btn" id="menu">${online ? "Leave room" : "Main menu"}</button></div></div>`);
    e.addEventListener("click", ev => { const c = ev.target.closest("[data-pid]"); if (c && known[c.dataset.pid]) detail(known[c.dataset.pid]); });
    e.querySelector("#menu").onclick = () => Online.leave();
    e.querySelector("#again").onclick = () => {
      if (online) return Online.toLobby();
      // Offline: same teams, names, colours and AI setup, fresh auction
      const r = RoomSettings.current, hadAI = AI.ids.size > 0;
      const teams = M.teams.map(t => TeamFactory.create({ name: t.name, color: t.color, slotCount: r.slots }));
      AI.stop(); AI.ids = new Set(hadAI ? teams.slice(1).map(t => t.id) : []);
      session = { teams, purses: PurseFactory.createMany(teams, r.purse) };
      Screens.show("auction");
    };
    if (iWon || !myTeam) setTimeout(() => confetti(winnerTeam.color), 50);
    return e;
  }
  return { on, NAMES, setup, auction, results, lassign };
})();

["main", "create", "join", "room"].forEach(id => Screens.register(id, MenuFactory[id]));
["setup", "auction", "results", "lassign"].forEach(id => Screens.register(id, LocalTestMode[id]));
Screens.register("lobby", Online.lobby); Screens.register("game", Online.game); Screens.register("assign", Online.assign);
Screens.show("main");

/* MEGA STONES preview: open the file with ?stonepreview at the end of the address to see the 5 cards. Safe to delete. */
if (/stonepreview/.test(location.search)) document.addEventListener("DOMContentLoaded", () => {
  const d = document.createElement("div"); d.className = "stone-preview";
  d.innerHTML = "<h2>Mega Stones preview</h2>" + StoneFactory.ids().map(id => renderStoneCard(StoneFactory.createLot(id))).join("") +
    '<button onclick="this.parentNode.remove()">Close</button>';
  document.body.appendChild(d);
});
</script>
