<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Auction</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1a14;--panel:#14261d;--card:#172b21;--line:#264434;--text:#eef3ee;--mute:#8fa89a;--ball:#d8402f;
        --diamond:#7fdcff;--gold:#e6b447;--silver:#bcc6d0;--bronze:#c9803f;
        --bat:#f2b134;--bowl:#e4574a;--all:#3cc4b0;--head:'Oswald','Arial Narrow',Impact,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(ellipse at 50% 120%,#1d4a34 0,transparent 60%),var(--bg)}
  #app{max-width:1000px;margin:0 auto;padding:24px 18px}
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* menu */
  .center{min-height:85vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .logo{width:74px;height:74px;border-radius:50%;background:var(--ball);position:relative;margin-bottom:18px;
    box-shadow:inset -8px -8px 14px #0004}
  .logo::before,.logo::after{content:"";position:absolute;left:8px;right:8px;height:2px;border-top:2px dashed #fff8;top:30px}
  .logo::after{top:42px}
  h1{font-family:var(--head);font-size:clamp(2.6rem,9vw,4.6rem);line-height:1;margin:0;letter-spacing:.02em}
  .sub{color:var(--mute);margin:10px 0 34px}
  .menu-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn{padding:15px 20px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:var(--head);font-size:1.2rem;letter-spacing:.05em}
  .btn.primary{background:var(--ball);border-color:var(--ball)}
  .btn:hover{filter:brightness(1.15)}
  .link{background:none;border:0;color:var(--mute);margin-top:16px}

  /* forms */
  .form{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:left}
  .form h2{font-family:var(--head);font-size:1.8rem;margin:0 0 18px}
  label{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;color:var(--mute);font-size:.9rem}
  label b{color:var(--text);font-family:var(--head);font-size:1.4rem}
  input[type=text],input[type=number]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
  input[type=range]{width:100%;accent-color:var(--ball)}
  .hint{font-size:.8rem;color:var(--mute);margin-top:2px}
  .code-in{text-align:center;font-family:var(--head);font-size:2rem!important;letter-spacing:.3em;text-transform:uppercase}
  .form .btn{width:100%;margin-top:22px}

  /* room header */
  .room{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .room h2{font-family:var(--head);margin:0;font-size:1.8rem}
  .room small{color:var(--mute)}
  .room .code{font-family:var(--head);background:var(--panel);border:1px dashed var(--gold);color:var(--gold);padding:2px 10px;border-radius:6px;letter-spacing:.15em}
  .room .btn{font-size:1rem;padding:8px 16px}

  /* player cards */
  #players{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .card{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .T-diamond{--t:var(--diamond)}.T-gold{--t:var(--gold)}.T-silver{--t:var(--silver)}.T-bronze{--t:var(--bronze)}
  .card .left{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:linear-gradient(160deg,color-mix(in srgb,var(--t) 35%,transparent),transparent);border-right:2px solid var(--t)}
  .tier{font-family:var(--head);color:var(--t);font-size:1.05rem;letter-spacing:.06em}
  .stars{font-size:.8rem;color:var(--t);letter-spacing:1px}
  .stars i{font-style:normal;opacity:.25}
  .card .body{padding:10px 12px;flex:1;min-width:0}
  .name{font-weight:700;font-size:1.05rem}
  .role{display:inline-block;margin-top:2px;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;
    color:var(--c);border:1px solid var(--c)}
  .BAT{--c:var(--bat)}.BOWL{--c:var(--bowl)}.ALL{--c:var(--all)}
  .STR{--c:var(--bowl)}.TAC{--c:var(--diamond)}.HYB{--c:var(--all)}
  .src{display:block;font-size:.68rem;color:var(--mute);margin-top:1px}
  .stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
  .stat b{display:block;font-size:.95rem}
  .stat span{font-size:.68rem;color:var(--mute)}
  .price{flex:none;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;border-left:1px solid var(--line)}
  .price b{font-family:var(--head);font-size:1.4rem;color:var(--t)}
  .price span{font-size:.68rem;color:var(--mute)}

  /* slider card (bottom of screen) */
  .slider-host{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:50}
  .slider-card{width:min(360px,92%);background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:7px 8px 0;
    box-shadow:0 -8px 30px #000a;transform:translateY(130%);transition:transform .3s ease-out;overflow:hidden}
  .slider-card.in{transform:none}
  .sc-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 5px;font-family:var(--head);letter-spacing:.05em}
  .sc-head span{color:var(--gold);font-size:.85rem}.sc-head b{font-size:.95rem}
  .slider-card .card{margin:0}
  .slider-card .card .left{width:56px;padding:4px 0;gap:2px}
  .slider-card .tier{font-size:.8rem}.slider-card .stars{font-size:.62rem}
  .slider-card .card .body{padding:6px 8px}
  .slider-card .name{font-size:.88rem}
  .slider-card .role{font-size:.6rem;padding:0 6px;margin-top:1px}
  .slider-card .stats{gap:2px 8px;margin-top:4px}
  .slider-card .stat b{font-size:.72rem}.slider-card .stat span{font-size:.56rem}
  .slider-card .price{padding:6px 8px}
  .slider-card .price b{font-size:1rem}.slider-card .price span{font-size:.56rem}
  .sc-bar{height:3px;margin:6px -8px 0;background:var(--line)}
  .sc-bar i{display:block;height:100%;background:var(--ball);animation:sc-shrink linear forwards}
  @keyframes sc-shrink{from{width:100%}to{width:0}}
  @media(prefers-reduced-motion:reduce){.slider-card{transition:none}}
  #players{padding-bottom:160px}

  /* team setup, auction stage, transition */
  .wide{width:min(640px,100%)!important}
  .trow{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:8px}
  .sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
  .swatch.on{border-color:#fff}
  .bidbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-family:var(--head);font-size:1.5rem}
  .bidbox small{color:var(--mute);font-family:system-ui,sans-serif;font-size:.8rem;margin-left:8px}
  .tn{display:flex;justify-content:space-between;gap:8px;font-weight:700}
  .tn span{font-size:.75rem;color:var(--mute);font-weight:600}
  .pu{margin:6px 0;font-family:var(--head);font-size:1.25rem}
  .pu small{font-family:system-ui,sans-serif;color:var(--mute);font-size:.72rem;display:block}
  .p-low .pu{color:var(--gold)}
  .p-empty{background:#2b2118;border-top-color:#6b4a2f;color:#a98a6a}
  .tb{display:flex;gap:6px}
  .tb button{flex:1;padding:8px 4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.8rem}
  .tb button[data-a=bid]{background:var(--ball);border-color:var(--ball);flex:1.7}
  .tb button:disabled{opacity:.35;cursor:not-allowed}
  .tview{margin-bottom:14px}.tview[hidden]{display:none}
  .tvt{border-left:4px solid var(--tc);background:var(--card);padding:8px 12px;margin-bottom:10px;border-radius:6px}
  .tvh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
  .tvh span{color:var(--mute);font-size:.85rem}
  .tvs{font-size:.85rem;padding:2px 0;display:flex;gap:8px;align-items:center}
  .tvs em{color:var(--mute);font-style:normal}.tvs i{color:var(--mute)}
  .toasts{position:fixed;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none}
  .toast{background:var(--panel);border:1px solid var(--ball);padding:8px 14px;border-radius:8px;font-size:.9rem;max-width:90%}
  .tr{position:fixed;inset:0;z-index:100;background:var(--bg);border-left:10px solid var(--tc);display:flex;align-items:center;justify-content:center;
    transform:translateX(-100%);transition:transform .4s ease}
  .tr.in{transform:none}.tr.out{transform:translateX(100%)}
  .tr-in{text-align:center;padding:20px}.tr-in small{display:block;color:var(--mute);min-height:1.2em}
  .tr-in h2{font-family:var(--head);font-size:clamp(2rem,8vw,3.6rem);margin:8px 0;color:var(--tc)}
  .tr-in p{margin:0;color:var(--mute)}
  @media(prefers-reduced-motion:reduce){.tr{transition:none}}
  @media(max-width:420px){#players{grid-template-columns:1fr}}

  /* per-player game screen */
  .mybox{background:var(--card);border:1px solid var(--gold);border-top:5px solid var(--tc);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .mybox .tn{font-family:var(--head);font-size:1.3rem;display:flex;justify-content:space-between;align-items:baseline}
  .mybox .tn span{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--mute);font-weight:600}
  .mybox .pu{font-family:var(--head);font-size:1.6rem;margin:4px 0}
  .mybox .pu small{font-family:system-ui,sans-serif;color:var(--mute);font-size:.75rem;display:block;font-weight:400}
  .mybox .tb button{padding:14px 6px;font-size:.95rem;border-radius:8px}
  .mybox .tb button[data-a=bid]{font-size:1.05rem}
  .oprows{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .oprow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-left:4px solid var(--tc);border-radius:8px;padding:8px 12px;font-size:.9rem}
  .oprow.lead{border-left-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .oprow b{font-weight:700}.oprow em{font-style:normal;color:var(--mute);font-size:.78rem}
  .standings{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:16px}
  .standings[hidden]{display:none}
  .srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .rk{font-family:var(--head);font-size:1.1rem;color:var(--gold);width:22px}
  .srow .sn{flex:1;font-weight:700}.srow .sn small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
  .srow .sc{font-family:var(--head);font-size:1.15rem}
  .toprow{display:flex;gap:8px;flex-wrap:wrap}

  /* results / celebration */
  .res-hero{text-align:center;padding:34px 16px 18px}
  .res-hero h1{font-family:var(--head);font-size:clamp(2.2rem,10vw,3.6rem);margin:6px 0;color:var(--gold)}
  .res-hero.lose h1{color:var(--mute)}
  .res-hero p{color:var(--mute);margin:0}
  .confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti{position:absolute;top:-20px;width:8px;height:14px;opacity:.9;animation:conf-fall linear forwards}
  @keyframes conf-fall{to{transform:translateY(110vh) rotate(540deg);opacity:.3}}
  .res-score{font-family:var(--head);font-size:2.2rem;text-align:center;color:var(--text);margin:6px 0 2px}
  .res-why{max-width:420px;margin:0 auto 20px;text-align:center;color:var(--mute);font-size:.88rem}
  .res-mine{border-color:var(--gold)!important;box-shadow:0 0 0 2px var(--gold)}
  .res-opp{opacity:.8}

  /* assign screen */
  .abar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 12px;overflow:hidden}
  .abar i{display:block;height:100%;background:var(--gold);transition:width .2s linear}
  .achars{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .achip{padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:.88rem}
  .achip.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
  .achip.placed{opacity:.35}
  .aslots{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .aslot{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px dashed var(--line);
    border-radius:8px;padding:10px 12px;font-size:.88rem}
  .aslot.filled{border-style:solid;border-color:var(--gold)}
  .aslot span{color:var(--mute)}
  .aslot.filled span{color:var(--text);font-weight:700}

  /* results reveal grid */
  .brow{padding:8px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .brow b{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
  .bcells{display:flex;flex-wrap:wrap;gap:6px}
  .bcell{font-size:.82rem;padding:4px 9px;border-radius:6px;border-left:3px solid var(--tc);background:var(--panel)}
  .bcell em{font-style:normal;font-weight:700;margin-left:6px}
  .bcell.win{box-shadow:0 0 0 1px var(--gold)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= Helpers ================= */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function toast(msg) {
  let h = document.querySelector(".toasts");
  if (!h) { h = document.createElement("div"); h.className = "toasts"; document.body.appendChild(h); }
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; h.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

/* ================= PlayerFactory =================
   Two switchable packs (GameMode.current, set at the bottom of this block): "cricket" (real players)
   or "anime" (200+ characters). Add a cricket player: one create(...) line in seedCricket(). Add anime
   characters: one entry in ANIME_GROUPS (name + power tier D/G/S/B) - stats/base price are generated
   from the tier automatically, so there's nothing else to fill in. */
const PlayerFactory = (() => {
  const TIERS = { diamond: "Diamond", gold: "Gold", silver: "Silver", bronze: "Bronze" };
  const RATING_PRICE = { 5: 2.0, 4: 1.5, 3: 1.0, 2: 0.5, 1: 0.2 };   // crore

  const MODES = {
    cricket: {
      roles: { ALL: "All-rounder", BAT: "Batsman", BOWL: "Bowler" },
      stats: {
        BAT:  { matches: "Matches", runs: "Runs", average: "Bat avg", strikeRate: "Strike rate", hundreds: "100s" },
        BOWL: { matches: "Matches", wickets: "Wickets", average: "Bowl avg", economy: "Economy", best: "Best" },
        ALL:  { runs: "Runs", batAvg: "Bat avg", wickets: "Wickets", economy: "Economy", matches: "Matches" }
      }
    },
    anime: {
      roles: { HYB: "All-Rounder", STR: "Powerhouse", TAC: "Tactician" },
      stats: {
        STR: { power: "Power", speed: "Speed", move: "Signature move" },
        TAC: { skill: "Skill", strategy: "Strategy", move: "Signature move" },
        HYB: { power: "Power", skill: "Skill", move: "Signature move" }
      }
    }
  };

  let mode = "cricket", ROLES = MODES.cricket.roles, STAT_SCHEMA = MODES.cricket.stats;
  let nextId = 1, list = [];

  function create(name, role, tier, rating, stats, source, core) {
    if (!ROLES[role]) throw new Error("Unknown role: " + role);
    if (!TIERS[tier]) throw new Error("Unknown tier: " + tier);
    if (!RATING_PRICE[rating]) throw new Error("Rating must be 1-5");
    const clean = {};
    for (const k in STAT_SCHEMA[role]) clean[k] = stats[k] ?? "-";
    const p = { id: nextId++, name, role, roleLabel: ROLES[role], tier, tierLabel: TIERS[tier],
                rating, basePrice: RATING_PRICE[rating], stats: clean, source: source || "", core: core || null };
    list.push(p);
    return p;
  }

  function seedCricket() {
    //            name                 role    tier       ★  stats
    create("Virat Kohli",       "BAT",  "diamond", 5, { matches: 252, runs: 8004, average: 38.7, strikeRate: 131.9, hundreds: 8 });
    create("Rohit Sharma",      "BAT",  "diamond", 5, { matches: 257, runs: 6628, average: 29.7, strikeRate: 130.4, hundreds: 2 });
    create("Jasprit Bumrah",    "BOWL", "diamond", 5, { matches: 133, wickets: 165, average: 22.5, economy: 7.4, best: "5/10" });
    create("Suryakumar Yadav",  "BAT",  "gold",    4, { matches: 150, runs: 3594, average: 32.0, strikeRate: 145.5, hundreds: 2 });
    create("Hardik Pandya",     "ALL",  "gold",    4, { runs: 2525, batAvg: 27.5, wickets: 64,  economy: 9.1, matches: 137 });
    create("Ravindra Jadeja",   "ALL",  "gold",    4, { runs: 2959, batAvg: 27.4, wickets: 160, economy: 7.6, matches: 240 });
    create("Rashid Khan",       "BOWL", "gold",    4, { matches: 121, wickets: 149, average: 22.0, economy: 6.8, best: "3/19" });
    create("Andre Russell",     "ALL",  "silver",  3, { runs: 2484, batAvg: 28.5, wickets: 115, economy: 9.2, matches: 140 });
    create("Trent Boult",       "BOWL", "silver",  3, { matches: 100, wickets: 120, average: 26.0, economy: 8.3, best: "4/18" });
    create("Yuzvendra Chahal",  "BOWL", "silver",  3, { matches: 160, wickets: 205, average: 22.0, economy: 7.9, best: "5/40" });
    create("Tilak Varma",       "BAT",  "bronze",  2, { matches: 50, runs: 1400, average: 36.0, strikeRate: 143.0, hundreds: 0 });
    create("Harshit Rana",      "BOWL", "bronze",  1, { matches: 25, wickets: 30, average: 26.0, economy: 9.3, best: "3/33" });
  }

  // ---- Anime pack: 200 characters across 20 shows. Tier letters = in-universe power: D(iamond)
  // = top-of-verse, G(old) = arc-level strong, S(ilver) = solid fighter, B(ronze) = supporting cast. ----
  const TIER_KEY = { D: "diamond", G: "gold", S: "silver", B: "bronze" };
  const TIER_RATING = { D: 5, G: 4, S: 3, B: 2 };
  const SIGNATURES = {
    "Goku": "Kamehameha", "Vegeta": "Final Flash", "Beerus": "Hakai", "Broly": "Gigantic Roar", "Frieza": "Death Beam",
    "Naruto": "Rasengan", "Sasuke": "Amaterasu", "Madara": "Susanoo", "Kaguya": "All-Killing Ash Bones",
    "Ichigo": "Getsuga Tensho", "Yhwach": "Almighty", "Aizen": "Kyoka Suigetsu",
    "Luffy": "Gear Five", "Shanks": "Conqueror's Haki", "Kaido": "Thunder Bagua",
    "All Might": "United States of Smash", "All For One": "Quirk Theft",
    "Saitama": "Serious Punch", "Blast": "Unmeasurable Power",
    "Eren": "Founding Titan Roar", "Levi": "Blade Dance",
    "Muzan": "Demon Curse", "Akaza": "Destructive Death",
    "Gojo": "Hollow Purple", "Sukuna": "Malevolent Shrine", "Toji": "Heavenly Restriction", "Yuta": "Cursed Copy",
    "Meruem": "Ultimate Nen Weapon", "Netero": "100-Type Guanyin Bodhisattva", "Chrollo": "Skill Hunter", "Neferpitou": "Doctor Blythe",
    "Father": "Philosopher's Stone", "Licht": "Mana Zone", "Julius": "Time Stop",
    "Gildarts": "Crash Magic", "Zeref": "Death Magic", "Acnologia": "Dragon King's Rage",
    "Charon": "Hellfire", "Toguro": "100% True Power", "Sensui": "Seven Chapters",
    "Dio": "The World", "Kars": "Ultimate Lifeform", "Pucci": "Made In Heaven",
    "Makima": "Control Devil", "Kishibe": "Blade Mastery",
    "Guts": "Dragon Slayer Swing", "Griffith": "Wings of Femto", "Zodd": "Apostle Rage",
    "Arima": "Quinque Mastery", "Eto": "One-Eyed Owl", "Mob": "100% Explosion"
  };
  const ANIME_GROUPS = {

/* ================= AttributeFactory =================
   20 battle attributes, each a weighted mix of a character's 6 core stats (POW/SPD/DUR/IQ/HAX/SKL).
   pick(n) draws a random n of the 20 for a given game - the number of slots picked at room creation. */
const AttributeFactory = (() => {
  const POOL = {
    strength:      { label: "Strength",       w: { POW: 1 } },
    speed:         { label: "Speed",          w: { SPD: 1 } },
    durability:    { label: "Durability",     w: { DUR: 1 } },
    battleIQ:      { label: "Battle IQ",      w: { IQ: 1 } },
    abilityPower:  { label: "Ability Power",  w: { HAX: .7, IQ: .3 } },
    weaponMastery: { label: "Weapon Mastery", w: { SKL: 1 } },
    stamina:       { label: "Stamina",        w: { DUR: .6, POW: .4 } },
    reflexes:      { label: "Reflexes",       w: { SPD: .6, IQ: .4 } },
    willpower:     { label: "Willpower",      w: { IQ: .5, DUR: .5 } },
    regeneration:  { label: "Regeneration",   w: { DUR: .7, HAX: .3 } },
    range:         { label: "Range",          w: { HAX: .6, SKL: .4 } },
    versatility:   { label: "Versatility",    w: { POW: 1/6, SPD: 1/6, DUR: 1/6, IQ: 1/6, HAX: 1/6, SKL: 1/6 } },
    experience:    { label: "Experience",     w: { IQ: .6, SKL: .4 } },
    instinct:      { label: "Instinct",       w: { SPD: .5, IQ: .5 } },
    precision:     { label: "Precision",      w: { SKL: .6, IQ: .4 } },
    intimidation:  { label: "Intimidation",   w: { POW: .7, IQ: .3 } },
    haxPotential:  { label: "Hax Potential",  w: { HAX: .9, SPD: .1 } },
    teamSynergy:   { label: "Team Synergy",   w: { IQ: .5, SKL: .5 } },
    adaptability:  { label: "Adaptability",   w: { IQ: .4, HAX: .3, SPD: .3 } },
    endurance:     { label: "Endurance",      w: { DUR: .8, POW: .2 } }
  };
  function score(p, id) {
    const def = POOL[id]; if (!def || !p.core) return 0;
    let s = 0; for (const k in def.w) s += (p.core[k] || 0) * def.w[k];
    return Math.round(s);
  }
  function pick(n) { return shuffle(Object.keys(POOL)).slice(0, Math.max(1, Math.min(n, Object.keys(POOL).length))); }
  return { pool: () => POOL, label: id => POOL[id].label, score, pick };
})();

  // 0..1: star value of the player, reduced if they sit in the wrong role's slot
  const slotScore = slot => !slot.player ? 0 :
    (slot.player.rating / 5) * (slot.player.role === slot.role ? 1 : config.mismatchPenalty);

  // 0..100: all top-rated players in the right slots = 100. Wrong roles and empty slots pull it down.
  const overall = team => Math.round(100 * team.slots.reduce((sum, s) => sum + slotScore(s), 0) / team.slots.length);

  const roleCounts = team => {
    const c = {}; Object.keys(team.quota).forEach(r => c[r] = 0);
    team.slots.forEach(s => { if (s.player) c[s.player.role] = (c[s.player.role] || 0) + 1; });
    return c;
  };
  const filledCount = team => team.slots.filter(s => s.player).length;
  const isFull = team => filledCount(team) === team.slots.length;
  const setName = (team, name) => { team.name = String(name).trim().slice(0, 20) || team.name; return team; };
  const setColor = (team, color) => { if (/^#[0-9a-f]{6}$/i.test(color)) team.color = color; return team; };

  return { config, roleQuota, create, createMany, addPlayer, removePlayer, slotScore, overall,
           roleCounts, filledCount, isFull, setName, setColor };
})();

/* ================= RankFactory =================
   Ranks teams by squad quality: star level (how good the players are) plus role
   diversity (how balanced batsmen/bowlers/all-rounders are, not stacked in one role).
   Reuses TeamFactory's slot/player data - no new state, just scoring. */
const RankFactory = (() => {
  const config = { starWeight: 0.65, diversityWeight: 0.35 };

  function starScore(team) {
    const filled = team.slots.filter(s => s.player);
    if (!filled.length) return 0;
    return Math.round(100 * filled.reduce((sum, s) => sum + s.player.rating / 5, 0) / filled.length);
  }

  // 100 = every role filled in equal proportion to the team's quota; stacking one role pulls it down.
  function diversityScore(team) {
    const counts = TeamFactory.roleCounts(team), roles = Object.keys(team.quota);
    const filled = TeamFactory.filledCount(team);
    if (!filled) return 0;
    let penalty = 0;
    roles.forEach(r => { const want = team.quota[r] ? team.quota[r] / team.slots.length : 0;
      penalty += Math.abs((counts[r] || 0) / filled - want); });
    return Math.round(100 * Math.max(0, 1 - penalty / 2));
  }

  function score(team) {
    const stars = starScore(team), diversity = diversityScore(team);
    const total = Math.round(stars * config.starWeight + diversity * config.diversityWeight);
    return { stars, diversity, total };
  }

  // Sorted best -> worst, each entry: { team, stars, diversity, total, rank }
  function rank(teams) {
    return teams.map(t => ({ team: t, ...score(t) }))
      .sort((a, b) => b.total - a.total)
      .map((r, i) => ({ ...r, rank: i + 1 }));
  }

  return { config, score, rank };
})();

/* ================= PurseFactory =================
   Not used by the UI yet. One purse per team, all independent. Pure calculation, plain data.
   Amounts are in rupee crore by default (change config.unit for another scale).
   Try in the console:  const t = TeamFactory.create(); const p = PurseFactory.create(t.id, 100);
                        PurseFactory.spend(p, 30, PlayerFactory.getById(1)); p.remaining */
const PurseFactory = (() => {
  const config = { symbol: "₹", unit: "Cr", lowPercent: 0.10 };
  const round = n => Math.round(n * 100) / 100;                 // avoids 0.1 + 0.2 style errors
  const format = n => config.symbol + round(n) + " " + config.unit;

  function create(teamId, total) {
    total = round(+total);
    if (!(total > 0)) throw new Error("Purse must be more than 0");
    return { teamId, total, remaining: total, spent: 0, lowWarned: false, blockedIds: [], history: [] };
  }
  // one independent purse per team, keyed by team id
  const createMany = (teams, total) => Object.fromEntries(teams.map(t => [t.id, create(t.id, total)]));

  const lowThreshold = p => round(p.total * config.lowPercent);   // 10% of THIS purse (12 of 120, 5 of 50...)
  const isLow = p => p.remaining <= lowThreshold(p);
  const canAfford = (p, price) => price > 0 && price <= p.remaining;

  // "ok" | "low" | "empty". "empty" = nothing left, or not enough even for the cheapest player (pass minPrice).
  const status = (p, minPrice = 0) => (p.remaining <= 0 || (minPrice && p.remaining < minPrice)) ? "empty" : isLow(p) ? "low" : "ok";

  // Splits a player pool into what this team can and cannot afford (flag for the UI later)
  function affordability(p, players, priceOf = pl => pl.basePrice) {
    const can = [], cant = [];
    players.forEach(pl => (canAfford(p, priceOf(pl)) ? can : cant).push(pl));
    return { can, cant };
  }

  // Deducts a purchase. Never goes below zero. Pass the remaining pool to also get the "can't afford" warning.
  // Warnings fire once: "low" once per team, "blocked" once per player.
  function spend(p, price, player = null, pool = null) {
    price = round(+price);
    if (!(price > 0)) return { ok: false, reason: "Invalid amount", warnings: [] };
    if (price > p.remaining)
      return { ok: false, reason: `Not enough purse: needs ${format(price)}, has ${format(p.remaining)}`, warnings: [] };
    p.remaining = round(p.remaining - price);
    p.spent = round(p.spent + price);
    p.history.push({ playerId: player ? player.id : null, price });

    const warnings = [];
    if (!p.lowWarned && isLow(p)) {
      p.lowWarned = true;
      warnings.push({ type: "low", message: `Low purse: only ${format(p.remaining)} left` });
    }
    if (pool) {
      const fresh = affordability(p, pool).cant.filter(pl => !p.blockedIds.includes(pl.id));
      if (fresh.length) {
        fresh.forEach(pl => p.blockedIds.push(pl.id));
        warnings.push({ type: "blocked", players: fresh, message: `Not enough purse for: ${fresh.map(pl => pl.name).join(", ")}` });
      }
    }
    return { ok: true, remaining: p.remaining, warnings };
  }

  // Gives the money back (for example if a purchase is undone)
  function refund(p, playerId) {
    const i = p.history.findIndex(h => h.playerId === playerId);
    if (i < 0) return { ok: false, reason: "No purchase found" };
    const [h] = p.history.splice(i, 1);
    p.remaining = round(p.remaining + h.price);
    p.spent = round(p.spent - h.price);
    return { ok: true, remaining: p.remaining };
  }

  return { config, format, create, createMany, lowThreshold, isLow, canAfford, status, affordability, spend, refund };
})();

/* ================= SliderCardFactory =================
   Shows any card at the bottom of the screen for N seconds, then slides it away.
   Reusable: pass any html, label and seconds. Only one card is on screen at a time.
   Try in the console:  SliderCardFactory.showPlayer(PlayerFactory.getById(1), 5) */
const SliderCardFactory = (() => {
  let host = null, current = null;

  function show({ html, label = "Up next", seconds = 15, onDone } = {}) {
    if (!host) { host = document.createElement("div"); host.className = "slider-host"; document.body.appendChild(host); }
    if (current) current.close(false);                       // a new card replaces the old one
    const el = document.createElement("div");
    el.className = "slider-card";
    el.innerHTML = `<div class="sc-head"><span>${label}</span><b>${seconds}s</b></div>${html}
      <div class="sc-bar"><i style="animation-duration:${seconds}s"></i></div>`;
    host.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));

    let left = seconds;
    const label$ = el.querySelector(".sc-head b");
    const tick = setInterval(() => { left--; label$.textContent = Math.max(left, 0) + "s"; if (left <= 0) handle.close(true); }, 1000);
    const handle = {
      reset(sec, lab) {                                      // restarts the countdown without sliding again
        left = sec; label$.textContent = sec + "s";
        if (lab) el.querySelector(".sc-head span").textContent = lab;
        const i = el.querySelector(".sc-bar i"); i.style.animation = "none"; void i.offsetWidth;
        i.style.animation = ""; i.style.animationDuration = sec + "s";
      },
      close(finished) {
        if (current !== handle) return;
        clearInterval(tick); current = null;
        el.classList.remove("in"); setTimeout(() => el.remove(), 350);
        if (onDone) onDone(finished);                        // finished = true when the time ran out
      }
    };
    current = handle;
    return handle;
  }

  const showPlayer = (player, seconds, opts = {}) => show({ html: renderPlayerCard(player), seconds, ...opts });
  const hide = () => { if (current) current.close(false); };

  return { show, showPlayer, hide };
})();

/* ================= BidFactory / SkipFactory / WithdrawFactory =================
   Pure lot logic (no screen). A "lot" is one player on the block. */
const BidFactory = (() => {
  const config = { bidSeconds: 50, increment: 0.25 };        // increment in crore
  const r2 = n => Math.round(n * 100) / 100;
  const leader = lot => lot.bids.length ? lot.bids[lot.bids.length - 1] : null;
  const nextAmount = lot => leader(lot) ? r2(leader(lot).amount + config.increment) : lot.player.basePrice;

  // ineligible: { teamId: "reason" } for teams that start out of this lot (squad full, can't afford)
  const createLot = (player, teamIds, ineligible = {}) => ({ player, teamIds, bids: [], out: { ...ineligible }, status: "open" });

  function bid(lot, teamId, purse) {
    if (lot.status !== "open") return { ok: false, reason: "Bidding is closed" };
    if (lot.out[teamId]) return { ok: false, reason: "You are out of this player" };
    if (leader(lot) && leader(lot).teamId === teamId) return { ok: false, reason: "You already lead" };
    const amount = nextAmount(lot);
    if (!PurseFactory.canAfford(purse, amount)) return { ok: false, reason: "Not enough purse" };
    lot.bids.push({ teamId, amount });
    return { ok: true, amount };
  }

  // Returns "sold" / "unsold" when the lot can end right now, else null
  function resolve(lot) {
    const active = lot.teamIds.filter(id => !lot.out[id]), lead = leader(lot);
    if (!lead) return active.length ? null : "unsold";               // everyone skipped: force skip
    return active.every(id => id === lead.teamId) ? "sold" : null;   // everyone else out: no need to wait
  }
  const close = lot => leader(lot) ? "sold" : "unsold";              // timer ran out

  return { config, leader, nextAmount, createLot, bid, resolve, close };
})();

const SkipFactory = {
  skip(lot, teamId) {
    if (lot.status !== "open" || lot.out[teamId]) return { ok: false, reason: "Can't skip now" };
    if (lot.bids.some(b => b.teamId === teamId)) return { ok: false, reason: "You bid already. Use withdraw" };
    lot.out[teamId] = "Skipped";
    return { ok: true };
  }
};

const WithdrawFactory = {
  withdraw(lot, teamId) {                                             // cancels your bids, counts as a skip
    if (lot.status !== "open" || lot.out[teamId] || !lot.bids.some(b => b.teamId === teamId)) return { ok: false, reason: "Nothing to withdraw" };
    lot.bids = lot.bids.filter(b => b.teamId !== teamId);
    lot.out[teamId] = "Withdrew";
    return { ok: true };
  }
};

/* ================= TransitionFactory: full-screen wipe between players ================= */
const TransitionFactory = {
  play({ top = "", title = "", sub = "", color = "var(--gold)" } = {}) {
    return new Promise(done => {
      const el = document.createElement("div");
      el.className = "tr"; el.style.setProperty("--tc", color);
      el.innerHTML = `<div class="tr-in"><small>${esc(top)}</small><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
      setTimeout(() => el.classList.add("out"), 1300);
      setTimeout(() => { el.remove(); done(); }, 1700);
    });
  }
};

/* ================= AuctionFactory: runs the lots using everything above ================= */
const AuctionFactory = (() => {
  function create({ teams, purses, pool, cardSeconds = 15, hooks = {} }) {
    const A = { teams, purses, queue: shuffle(pool.slice()), total: pool.length, done: 0, lot: null,
                handle: null, results: [], finished: false, stopped: false };
    const emit = () => hooks.onUpdate && hooks.onUpdate(A);
    const teamOf = id => teams.find(t => t.id === id);
    const reason = (t, p) => TeamFactory.isFull(t) ? "Squad full" : !PurseFactory.canAfford(purses[t.id], p.basePrice) ? "Can't afford" : null;

    async function nextLot(msg) {
      A.lot = null;
      while (A.queue.length && !teams.every(t => TeamFactory.isFull(t))) {
        const p = A.queue.shift(), out = {};
        teams.forEach(t => { const r = reason(t, p); if (r) out[t.id] = r; });
        const lot = BidFactory.createLot(p, teams.map(t => t.id), out);
        if (BidFactory.resolve(lot)) { A.done++; A.results.push({ player: p, status: "unsold" }); msg = "Unsold: " + p.name; continue; }
        emit();
        const tro = { top: msg, title: p.name, sub: p.tierLabel + " · base " + PurseFactory.format(p.basePrice), color: `var(--${p.tier})` };
        hooks.onTransition && hooks.onTransition(tro);
        await TransitionFactory.play(tro);
        if (A.stopped) return;
        A.lot = lot; A.deadline = Date.now() + cardSeconds * 1000;
        A.handle = SliderCardFactory.showPlayer(p, cardSeconds, { label: "On the block", onDone: ran => { if (ran) endLot(BidFactory.close(lot)); } });
        emit(); return;
      }
      A.finished = true; emit(); hooks.onFinish && hooks.onFinish(A);
    }

    function endLot(result) {
      const lot = A.lot; if (!lot || lot.status !== "open") return;
      lot.status = result; A.lot = null;
      const h = A.handle; A.handle = null; if (h) h.close(false);
      let msg;
      if (result === "sold") {
        const w = BidFactory.leader(lot), t = teamOf(w.teamId);
        TeamFactory.addPlayer(t, lot.player);
        PurseFactory.spend(purses[t.id], w.amount, lot.player, A.queue)
          .warnings.forEach(x => hooks.onWarn && hooks.onWarn(t, x));   // low purse (once) / can't afford (once per player)
        A.results.push({ player: lot.player, status: "sold", teamId: t.id, price: w.amount });
        msg = `Sold: ${lot.player.name} to ${t.name} for ${PurseFactory.format(w.amount)}`;
      } else { A.results.push({ player: lot.player, status: "unsold" }); msg = "Unsold: " + lot.player.name; }
      A.done++;
      nextLot(msg);
    }

    // action(fn, restartTimer): runs a bid/skip/withdraw, then checks if the lot can end
    const action = (fn, retimer) => id => {
      const lot = A.lot; if (!lot || lot.status !== "open") return { ok: false };
      const r = fn(lot, id);
      if (!r.ok) return r;
      if (retimer) { const sec = lot.bids.length ? BidFactory.config.bidSeconds : cardSeconds; A.deadline = Date.now() + sec * 1000; A.handle.reset(sec, lot.bids.length ? "Bidding" : "On the block"); }
      const res = BidFactory.resolve(lot);
      if (res) endLot(res); else emit();
      return r;
    };
    A.bid = action((lot, id) => BidFactory.bid(lot, id, purses[id]), true);
    A.skip = action(SkipFactory.skip, false);
    A.withdraw = action(WithdrawFactory.withdraw, true);
    A.stop = () => { A.stopped = true; };
    A.start = () => nextLot("Auction begins");

    // what a screen needs to draw each team's buttons
    A.view = () => teams.map(t => {
      const lot = A.lot, open = !!lot && lot.status === "open", purse = purses[t.id];
      const mine = open ? lot.bids.filter(b => b.teamId === t.id).length : 0, out = open ? lot.out[t.id] : null;
      const lead = open && BidFactory.leader(lot) && BidFactory.leader(lot).teamId === t.id;
      return { team: t, purse, lead, status: !open ? "" : out || (lead ? "Leading" : mine ? "Outbid" : "Deciding"),
        canBid: open && !out && !lead && PurseFactory.canAfford(purse, BidFactory.nextAmount(lot)),
        canSkip: open && !out && !mine, canWithdraw: open && !out && mine > 0 };
    });
    return A;
  }
  return { create };
})();

/* ================= Online play: Net + GameView + Online =================
   The host's browser runs the auction engine. The server only relays messages.
   Each player controls only the team they own. */
const mk = html => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

const Net = { ws: null, id: null, code: null, host: false, h: {},
  connect() { return new Promise((ok, no) => {
    const ws = Net.ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
    ws.onopen = () => ok(); ws.onerror = () => no();
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } if (Net.h[m.t]) Net.h[m.t](m); };
    ws.onclose = () => Net.h.closed && Net.h.closed();
  }); },
  send: m => { if (Net.ws && Net.ws.readyState === 1) Net.ws.send(JSON.stringify(m)); } };

// everything a screen needs, as plain data (safe to send over the network)
const modelOf = A => {
  const lot = A.lot && A.lot.status === "open" ? A.lot : null, ld = lot && BidFactory.leader(lot);
  return { teams: A.teams, purses: A.purses, done: A.done, total: A.total,
    minP: A.queue.length ? Math.min(...A.queue.map(p => p.basePrice)) : 0,
    left: A.deadline ? Math.max(0, Math.round((A.deadline - Date.now()) / 1000)) : 0,
    lot: lot && { player: lot.player, next: BidFactory.nextAmount(lot), lead: ld ? ld.teamId : null, bidding: lot.bids.length > 0 },
    view: A.view().map(v => ({ id: v.team.id, lead: v.lead, status: v.status, canBid: v.canBid, canSkip: v.canSkip, canWithdraw: v.canWithdraw })) };
};

const GameView = (() => {
  let refresh = () => {};
  const fmt = n => PurseFactory.format(n);

  function standingsHtml(teams) {
    return RankFactory.rank(teams).map(r => `<div class="srow">
      <div class="rk">#${r.rank}</div>
      <div class="sn" style="color:${r.team.color}">${esc(r.team.name)}<small>${r.stars}★ level · ${r.diversity} balance</small></div>
      <div class="sc">${r.total}</div></div>`).join("");
  }

  function build(M0, o) {                 // o: { act(kind, teamId), stop?, canControl(team) }
    const e = mk(`<div style="padding-bottom:150px"><div class="room"><h2>Auction</h2><span class="toprow"><button class="btn" id="tv">Standings</button> ${o.stop ? '<button class="btn" id="stop">Stop</button>' : ""}</span></div>
      <div class="standings" id="standings" hidden></div>
      <div class="bidbox" id="bb"></div>
      <div id="mine"></div>
      <div class="oprows" id="ops"></div></div>`);
    const draw = M => {
      const l = M.lot, nm = id => esc(M.teams.find(t => t.id === id).name);
      e.querySelector("#bb").innerHTML = l
        ? `${esc(l.player.name)}<small>Next bid ${fmt(l.next)}${l.lead ? " · leading: " + nm(l.lead) : ""} · Lot ${M.done + 1}/${M.total}</small>`
        : `Next player…<small>${M.done}/${M.total} done</small>`;
      e.querySelector("#standings").innerHTML = standingsHtml(M.teams);

      const rows = M.view.map(v => ({ v, t: M.teams.find(x => x.id === v.id), p: M.purses[v.id], mine: o.canControl(M.teams.find(x => x.id === v.id)) }));
      const mine = rows.filter(r => r.mine), ops = rows.filter(r => !r.mine);

      e.querySelector("#mine").innerHTML = mine.map(({ v, t, p }) => {
        const d = f => f ? "" : "disabled";
        return `<div class="mybox p-${PurseFactory.status(p, M.minP)}${v.lead ? " lead" : ""}" style="--tc:${t.color}">
          <div class="tn">${esc(t.name)}<span>Your team · ${v.status || (l ? "Ready" : "Waiting")}</span></div>
          <div class="pu">${fmt(p.remaining)}<small>${TeamFactory.filledCount(t)}/${t.slots.length} players filled</small></div>
          <div class="tb"><button data-a="bid" data-id="${t.id}" ${d(v.canBid)}>Bid ${l ? fmt(l.next) : ""}</button>
          <button data-a="skip" data-id="${t.id}" ${d(v.canSkip)}>Skip</button>
          <button data-a="withdraw" data-id="${t.id}" ${d(v.canWithdraw)}>Withdraw</button></div></div>`;
      }).join("") || (Net.code ? "" : `<div class="hint">You're spectating - no team of yours in this auction.</div>`);

      e.querySelector("#ops").innerHTML = ops.map(({ v, t, p }) => `<div class="oprow${v.lead ? " lead" : ""}" style="--tc:${t.color}">
        <b style="color:${t.color}">${esc(t.name)}</b>
        <em>${TeamFactory.filledCount(t)}/${t.slots.length} · ${fmt(p.remaining)} left${v.status ? " · " + v.status : ""}</em></div>`).join("");
    };
    refresh = M => { if (e.isConnected) draw(M); };
    e.querySelector("#mine").onclick = ev => { const b = ev.target.closest("button[data-a]"); if (b && !b.disabled) o.act(b.dataset.a, +b.dataset.id); };
    e.querySelector("#tv").onclick = () => { const v = e.querySelector("#standings"); v.hidden = !v.hidden; };
    if (o.stop) e.querySelector("#stop").onclick = o.stop;
    draw(M0);
    return e;
  }
  return { build, refresh: M => refresh(M), standingsHtml };
})();

/* ================= AssignView: private, tap-to-place attribute screen =================
   Each player sees only their own purchased characters and this game's attribute slots. Tap a
   character, then tap a slot to place them (tap again to unplace); nothing is revealed to anyone
   else until the results screen after everyone locks in or the 60s timer runs out. */
const AssignView = (() => {
  function build(myChars, attrIds, deadline, onSubmit) {
    const state = {};           // attrId -> playerId
    let selected = null, submitted = false;
    const e = mk(`<div class="assign"><div class="room"><h2>Assign your line-up</h2></div>
      <div class="abar"><i id="abari"></i></div>
      <p class="hint">Tap a character, then tap an attribute to place them. This stays hidden until reveal.</p>
      <div class="achars" id="achars"></div>
      <div class="aslots" id="aslots"></div>
      <button class="btn primary" id="lock">Lock in</button></div>`);
    const charName = id => (myChars.find(c => c.id === id) || {}).name || "";
    const draw = () => {
      e.querySelector("#achars").innerHTML = myChars.map(c => {
        const placed = Object.values(state).includes(c.id);
        return `<button class="achip${placed ? " placed" : ""}${selected === c.id ? " sel" : ""}" data-id="${c.id}" ${placed && !submitted ? "" : submitted ? "disabled" : ""}>${esc(c.name)}</button>`;
      }).join("");
      e.querySelector("#aslots").innerHTML = attrIds.map(id => `<div class="aslot${state[id] ? " filled" : ""}" data-attr="${id}">
        <b>${esc(AttributeFactory.label(id))}</b><span>${state[id] ? esc(charName(state[id])) : "Tap to place"}</span></div>`).join("");
      const lock = e.querySelector("#lock");
      lock.disabled = submitted || Object.keys(state).length < Math.min(myChars.length, attrIds.length);
      lock.textContent = submitted ? "Waiting for others…" : "Lock in";
    };
    e.querySelector("#achars").onclick = ev => {
      if (submitted) return;
      const b = ev.target.closest(".achip"); if (!b) return;
      const id = +b.dataset.id;
      if (Object.values(state).includes(id)) { for (const k in state) if (state[k] === id) delete state[k]; selected = null; }
      else selected = selected === id ? null : id;
      draw();
    };
    e.querySelector("#aslots").onclick = ev => {
      if (submitted) return;
      const s = ev.target.closest(".aslot"); if (!s) return;
      const id = s.dataset.attr;
      if (selected != null) { for (const k in state) if (state[k] === selected) delete state[k]; state[id] = selected; selected = null; }
      else if (state[id] != null) delete state[id];
      draw();
    };
    const submit = () => { if (submitted) return; submitted = true; onSubmit({ ...state }); draw(); };
    e.querySelector("#lock").onclick = submit;
    const iv = setInterval(() => {
      const left = Math.max(0, deadline - Date.now());
      const bar = e.querySelector("#abari"); if (bar) bar.style.width = Math.round(left / 60000 * 100) + "%"; else clearInterval(iv);
      if (left <= 0) { clearInterval(iv); submit(); }
    }, 200);
    draw();
    return e;
  }
  return { build };
})();

const Online = (() => {
  const L = { room: "", players: [], started: false, max: 4 };   // lobby: the host owns it and broadcasts it
  let A = null, inGame = false, guestCard = null, guestLot = null, refreshLobby = () => {}, lastM = null;
  let assignAttrs = [], assignDeadline = 0, assignPicks = {}, assignTimer = null, assignDone = false;
  const me = () => L.players.find(p => p.id === Net.id);
  const lobbyBc = () => { Net.send({ t: "lobby", L }); refreshLobby(); };

  function leave() {
    Net.h = {}; if (Net.ws) Net.ws.close(); clearTimeout(assignTimer);
    Net.ws = null; Net.code = null; Net.id = null; A = null; inGame = false; guestCard = guestLot = null; lastM = null;
    Screens.show("main");
  }

  function hostAct(kind, from, payload) {        // runs on the host: a player asks to bid/skip/withdraw/assign for their own team
    if (kind === "assign") return receiveAssign(from, payload);
    const team = A && A.teams.find(t => t.owner === from);
    if (!team || !["bid", "skip", "withdraw"].includes(kind)) return;
    const r = A[kind](team.id);
    if (r && r.reason) { if (from === Net.id) toast(r.reason); else Net.send({ t: "toast", to: from, msg: r.reason }); }
  }

  function receiveAssign(from, picks) {           // host: collect one team's private assignment
    const team = A && A.teams.find(t => t.owner === from); if (!team || assignDone) return;
    assignPicks[team.id] = picks || {};
    if (Object.keys(assignPicks).length >= A.teams.length) finalizeAssign();
  }

  function finalizeAssign() {                     // host: everyone's in (or time's up) - reveal to all at once
    if (assignDone) return; assignDone = true; clearTimeout(assignTimer);
    A.teams.forEach(t => { if (!assignPicks[t.id]) assignPicks[t.id] = {}; });   // anyone who never locked in gets an empty board
    const M = { teams: A.teams, purses: A.purses, results: A.results, finished: A.finished,
                assign: { attrs: assignAttrs, picks: assignPicks } };
    Net.send({ t: "end", M }); Screens.show("results", M);
  }

  function finish() {                             // auction just ended - open the private assign phase instead of results
    const cfg = RoomSettings.current;
    assignAttrs = AttributeFactory.pick(cfg.slots || 6); assignDeadline = Date.now() + 60000; assignPicks = {}; assignDone = false;
    Net.send({ t: "assign-start", attrs: assignAttrs, deadline: assignDeadline });
    clearTimeout(assignTimer); assignTimer = setTimeout(finalizeAssign, 60300);
    const team = A.teams.find(t => t.owner === Net.id);
    Screens.show("assign", { attrs: assignAttrs, deadline: assignDeadline, team });
  }

  function assign(data) {                         // host and guests both render this from their own team's squad
    const myChars = data.team ? data.team.slots.filter(s => s.player).map(s => s.player) : [];
    return AssignView.build(myChars, data.attrs, data.deadline, picks => {
      if (Net.host) receiveAssign(Net.id, picks); else Net.send({ t: "act", kind: "assign", payload: picks });
    });
  }

  function start() {
    const cfg = RoomSettings.current, pal = TeamFactory.config.palette;
    L.started = true; lobbyBc();
    const names = shuffle(LocalTestMode.NAMES.slice()), used = new Set(L.players.map(p => p.color).filter(Boolean));
    const teams = L.players.map(p => {
      const c = p.color || shuffle(pal.filter(x => !used.has(x)))[0] || pal[0]; used.add(c);
      return TeamFactory.create({ name: p.teamName.trim() || names.pop() || "Team " + p.id, color: c, owner: p.id, slotCount: cfg.slots });
    });
    A = AuctionFactory.create({ teams, purses: PurseFactory.createMany(teams, cfg.purse), pool: PlayerFactory.getAll(),
      cardSeconds: cfg.timer > 0 ? cfg.timer : 15,
      hooks: { onUpdate: () => { const M = modelOf(A); Net.send({ t: "snap", M }); GameView.refresh(M); },
        onWarn: (t, w) => { const msg = t.name + ": " + w.message; toast(msg); Net.send({ t: "toast", msg }); },
        onTransition: o => Net.send({ t: "tr", o }), onFinish: finish } });
    inGame = true; Net.send({ t: "snap", M: modelOf(A) }); Screens.show("game", modelOf(A));
    setTimeout(A.start, 0);
  }

  function syncCard(M) {                          // guests: mirror the host's bottom card and countdown
    const l = M.lot;
    if (!l) { SliderCardFactory.hide(); guestCard = guestLot = null; return; }
    const label = l.bidding ? "Bidding" : "On the block";
    if (guestLot !== l.player.id) { guestLot = l.player.id; guestCard = SliderCardFactory.showPlayer(l.player, M.left, { label }); }
    else if (guestCard) guestCard.reset(M.left, label);
  }

  async function open(mode, o) {
    try { await Net.connect(); } catch { toast("Can't reach the server. Add ?local to the address to test offline."); return; }
    const cfg = RoomSettings.current;
    Net.host = mode === "create"; inGame = false; L.started = false; L.players = [];
    Net.h = {
      created: m => { Net.id = m.id; Net.code = m.code; Object.assign(L, { room: cfg.name, max: cfg.players });
        L.players = [{ id: m.id, name: o.name, teamName: o.teamName || "", color: o.color || "" }]; Screens.show("lobby"); },
      joined: m => { Net.id = m.id; Net.code = m.code; Screens.show("lobby"); },
      err: m => toast(m.msg),
      "peer-join": m => { if (L.started || L.players.length >= L.max) return Net.send({ t: "full", to: m.id });
        L.players.push({ id: m.id, name: m.name, teamName: m.teamName || "", color: m.color || "" }); lobbyBc();
        if (L.players.length >= L.max) start(); },
      "peer-left": m => { const p = L.players.find(x => x.id === m.id);
        if (L.started) { if (p) toast(p.name + " left"); } else { L.players = L.players.filter(x => x.id !== m.id); lobbyBc(); } },
      act: m => hostAct(m.kind, m.from, m.payload),
      lobby: m => { Object.assign(L, m.L); refreshLobby(); },
      full: () => { toast("Room is full or already started"); leave(); },
      snap: m => { lastM = m.M; if (!inGame) { inGame = true; Screens.show("game", m.M); } else GameView.refresh(m.M); syncCard(m.M); },
      tr: m => TransitionFactory.play(m.o),
      toast: m => toast(m.msg),
      "assign-start": m => { const team = lastM && lastM.teams.find(t => t.owner === Net.id);
        Screens.show("assign", { attrs: m.attrs, deadline: m.deadline, team }); },
      end: m => Screens.show("results", m.M),
      closed: () => { toast("Room closed"); leave(); }
    };
    Net.send(Net.host ? { t: "create" } : { t: "join", code: o.code, name: o.name, teamName: o.teamName, color: o.color });
  }

  function lobby() {
    const e = mk(`<div class="center"><div class="form wide"><h2 id="rn"></h2>
      <p class="hint">Room code: <b class="code" style="padding:2px 10px">${esc(Net.code)}</b></p>
      <p class="hint">Link: ${esc(location.origin)}/?join=${esc(Net.code)}</p>
      <div id="pl" style="margin:14px 0"></div>
      <p class="hint" id="wait"></p><button class="btn primary" id="go">Start auction</button><button class="link" id="lv">Leave</button></div></div>`);
    const go = e.querySelector("#go");
    refreshLobby = () => {
      if (!e.isConnected) return;
      e.querySelector("#rn").textContent = L.room || "Room";
      e.querySelector("#pl").innerHTML = L.players.map(p => `<div class="tvs"><i style="width:12px;height:12px;border-radius:50%;background:${p.color || "#444"};display:inline-block"></i>
        <b>${esc(p.teamName || p.name)}</b>${p.id === Net.id ? " (you)" : ""}</div>`).join("");
      go.hidden = !Net.host;
      const enough = L.players.length >= 2;
      if (Net.host) go.disabled = !enough;
      e.querySelector("#wait").textContent = Net.host
        ? (enough
            ? L.players.length + " of " + L.max + " players joined. Starts automatically once full, or start now."
            : "Waiting for at least one more player to join with code " + esc(Net.code) + "…")
        : "Waiting for the host to start…";
    };
    go.onclick = start; e.querySelector("#lv").onclick = leave;
    setTimeout(refreshLobby, 0);
    return e;
  }

  function game(M) {
    return GameView.build(M, { act: (k, id) => { if (Net.host) hostAct(k, Net.id); else Net.send({ t: "act", kind: k }); },
      stop: Net.host ? () => { A.stop(); finish(); } : null, canControl: t => t.owner === Net.id });
  }

  return { open, lobby, game, assign, leave };
})();

/* ================= LocalTestMode =================
   Temporary one-screen test harness. Set LocalTestMode.on = false (or delete this whole block plus the
   last "register" line) and the create screen goes back to the normal room screen. The engine above
   (Team/Purse/Bid/Skip/Withdraw/AuctionFactory) never touches this block. */
const LocalTestMode = (() => {
  const on = new URLSearchParams(location.search).has("local"), SETUP_SECONDS = 50;
  const NAMES = ["Royal Strikers", "Night Owls", "Thunder Kings", "Desert Hawks", "Silver Foxes", "Iron Wolves", "Blue Comets",
    "Red Dragons", "Golden Eagles", "Storm Riders", "Pink Panthers", "Green Mambas", "Sun Chasers", "Ice Breakers", "Wild Bulls", "Mighty Otters"];
  const el = html => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
  let session = null;

  function setup() {
    const r = RoomSettings.current, palette = TeamFactory.config.palette;
    const teams = TeamFactory.createMany(r.teams, r.slots), colorSet = teams.map(() => false);
    const rows = teams.map((t, i) => `<div class="trow"><input type="text" maxlength="20" placeholder="Team ${i + 1} name" data-i="${i}">
      <div class="sw">${palette.map(c => `<button class="swatch" data-i="${i}" data-c="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div></div>`).join("");
    const e = el(`<div class="center"><div class="form wide"><h2>Name your teams</h2>
      <p class="hint">Time left: <b id="left">${SETUP_SECONDS}s</b>. Anything left empty is filled randomly.</p>${rows}
      <button class="btn primary" id="go" disabled>Start auction</button><button class="link" id="back">Back</button></div></div>`);
    const inputs = [...e.querySelectorAll("input")], sw = [...e.querySelectorAll(".swatch")], go = e.querySelector("#go");
    const taken = (c, i) => teams.some((t, j) => j !== i && colorSet[j] && t.color === c);
    const paint = () => sw.forEach(b => { const i = +b.dataset.i; b.classList.toggle("on", colorSet[i] && teams[i].color === b.dataset.c);
      b.disabled = taken(b.dataset.c, i); b.style.opacity = b.disabled ? .2 : 1; });
    const ready = () => { go.disabled = !(inputs.every(x => x.value.trim()) && colorSet.every(Boolean)); };
    inputs.forEach(x => x.oninput = ready);
    sw.forEach(b => b.onclick = () => { const i = +b.dataset.i; if (taken(b.dataset.c, i)) return; teams[i].color = b.dataset.c; colorSet[i] = true; paint(); ready(); });
    e.querySelector("#back").onclick = () => { clearInterval(timer); Screens.show("create"); };

    let left = SETUP_SECONDS;
    const timer = setInterval(() => {
      if (!e.isConnected) return clearInterval(timer);
      e.querySelector("#left").textContent = Math.max(--left, 0) + "s";
      if (left > 0) return;
      clearInterval(timer);
      const used = new Set(inputs.map(x => x.value.trim().toLowerCase()).filter(Boolean));
      const names = shuffle(NAMES.filter(n => !used.has(n.toLowerCase())));
      inputs.forEach(x => { if (!x.value.trim()) x.value = names.pop() || "Team " + (+x.dataset.i + 1); });
      teams.forEach((t, i) => { if (!colorSet[i]) { const free = palette.filter(c => !taken(c, i)); t.color = free[Math.floor(Math.random() * free.length)] || palette[0]; colorSet[i] = true; } });
      paint(); ready(); toast("Time up: empty teams were filled randomly");
    }, 1000);

    go.onclick = () => {
      clearInterval(timer);
      teams.forEach((t, i) => { TeamFactory.setName(t, inputs[i].value); TeamFactory.setColor(t, t.color); });
      session = { teams, purses: PurseFactory.createMany(teams, r.purse) };
      Screens.show("auction");
    };
    paint();
    return e;
  }

  function auction() {
    const r = RoomSettings.current, { teams, purses } = session;
    const A = AuctionFactory.create({ teams, purses, pool: PlayerFactory.getAll(), cardSeconds: r.timer > 0 ? r.timer : 15,
      hooks: { onUpdate: () => GameView.refresh(modelOf(A)), onWarn: (t, w) => toast(t.name + ": " + w.message), onFinish: () => Screens.show("results", A) } });
    session.A = A;
    const e = GameView.build(modelOf(A), { act: (k, id) => { const x = A[k](id); if (x && x.reason) toast(x.reason); },
      stop: () => { A.stop(); Screens.show("results", A); }, canControl: () => true });
    setTimeout(A.start, 0);
    return e;
  }

  function confetti(color) {
    const wrap = document.createElement("div"); wrap.className = "confetti-wrap";
    const colors = [color, "#e6b447", "#7fdcff", "#8ad06a", "#f28cb8"];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("div"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "%";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2.2 + Math.random() * 1.6) + "s";
      c.style.animationDelay = (Math.random() * .6) + "s";
      wrap.appendChild(c);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 4500);
  }

  // Each player's browser renders this independently, so it's personalized: my team is
  // highlighted at the top with a win/lose hero, everyone else's teams follow ranked below.
  // When M.assign is present (the online flow), the winner is decided by the private attribute
  // assignment everyone just locked in, revealed here for the first time - not just squad quality.
  function results(M) {
    M = M || session.A;
    const unsold = M.results.filter(x => x.status !== "sold");
    const rank = RankFactory.rank(M.teams);
    const myTeam = M.teams.find(t => t.owner === Net.id);
    const status = M.finished ? "Auction complete" : "Auction stopped";

    let board = null, totals = null, winnerTeam = rank[0].team, winnerPts = rank[0].total, myPts = null;
    if (M.assign && M.assign.attrs && M.assign.attrs.length) {
      const attrs = M.assign.attrs, picks = M.assign.picks || {};
      const findPlayer = id => { for (const t of M.teams) for (const s of t.slots) if (s.player && s.player.id === id) return s.player; return null; };
      totals = {}; M.teams.forEach(t => totals[t.id] = 0);
      board = attrs.map(attrId => {
        const row = M.teams.map(t => {
          const pid = (picks[t.id] || {})[attrId], p = pid != null ? findPlayer(pid) : null;
          const s = p ? AttributeFactory.score(p, attrId) : 0;
          totals[t.id] += s;
          return { team: t, player: p, score: s };
        });
        return { attrId, row, best: Math.max(...row.map(x => x.score)) };
      });
      winnerTeam = M.teams.reduce((a, b) => totals[b.id] > totals[a.id] ? b : a);
      winnerPts = totals[winnerTeam.id];
      myPts = myTeam ? totals[myTeam.id] : null;
    } else if (myTeam) {
      myPts = rank.find(r => r.team.id === myTeam.id).total;
    }
    const iWon = !!(myTeam && winnerTeam.id === myTeam.id);

    const heroHtml = myTeam
      ? `<div class="res-hero${iWon ? "" : " lose"}"><small>${status}</small>
          <h1>${iWon ? "🏆 You won!" : "So close — you lost"}</h1>
          <div class="res-score" style="color:${myTeam.color}">${esc(myTeam.name)} · ${myPts} pts</div>
          <p class="res-why">${iWon ? "Your line-up scored highest overall." : `${esc(winnerTeam.name)} won with ${winnerPts} pts.`}</p></div>`
      : `<div class="res-hero"><small>${status}</small><h1>🏆 ${esc(winnerTeam.name)} wins</h1>
          <div class="res-score" style="color:${winnerTeam.color}">${winnerPts} pts</div></div>`;

    const boardHtml = board ? `<div class="tvt" style="--tc:var(--gold)"><div class="tvh"><b>Reveal</b><span>Nobody saw this until now</span></div>
      ${board.map(r => `<div class="brow"><b>${esc(AttributeFactory.label(r.attrId))}</b><div class="bcells">
        ${r.row.map(x => `<span class="bcell${x.score === r.best && x.score > 0 ? " win" : ""}" style="--tc:${x.team.color}">${x.player ? esc(x.player.name) : "—"}<em>${x.score}</em></span>`).join("")}
      </div></div>`).join("")}</div>` : "";

    const ordered = myTeam ? [rank.find(r => r.team.id === myTeam.id), ...rank.filter(r => r.team.id !== myTeam.id)] : rank;
    const teamCard = r => { const t = r.team, isMine = myTeam && t.id === myTeam.id, squad = t.slots.filter(s => s.player);
      return `<div class="tvt ${isMine ? "res-mine" : "res-opp"}" style="--tc:${t.color}">
        <div class="tvh"><b>${esc(t.name)}${isMine ? " (you)" : ""}</b><span>Squad quality: ${r.total} · ${r.stars}★ · ${r.diversity} balance</span></div>
        ${squad.map(s => `<div class="tvs"><em>${s.role}</em>${esc(s.player.name)}</div>`).join("") || "<div class='tvs'><i>No players</i></div>"}</div>`; };

    const e = el(`<div><div class="room"><h2>Results</h2><button class="btn" id="menu">Main menu</button></div>
      ${heroHtml}${boardHtml}${ordered.map(teamCard).join("")}
      <div class="tvt" style="--tc:var(--mute)"><div class="tvh"><b>Unsold</b></div>${unsold.map(x => `<div class="tvs">${esc(x.player.name)}</div>`).join("") || "<div class='tvs'><i>None</i></div>"}</div></div>`);
    e.querySelector("#menu").onclick = () => Online.leave();
    if (iWon || !myTeam) setTimeout(() => confetti(winnerTeam.color), 50);
    return e;
  }

  return { on, NAMES, setup, auction, results };
})();

["main", "create", "join", "room"].forEach(id => Screens.register(id, MenuFactory[id]));
["setup", "auction", "results"].forEach(id => Screens.register(id, LocalTestMode[id]));
Screens.register("lobby", Online.lobby); Screens.register("game", Online.game); Screens.register("assign", Online.assign);
Screens.show("main");
</script>
</body>
</html>
